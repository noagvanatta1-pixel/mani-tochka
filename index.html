<style>
/* Копилка: кобальт + монетная латунь */
:root{
  --bg:#eef0f7;--card:#fff;--ink:#101936;--muted:#6b7494;
  --pink:#7d8cff;--pink-d:#2f45ff;--pink-l:#e4e8ff;
  --green:#0f9d73;--red:#e5484d;--r:1.125rem;--nav:4.25rem;
  --sh:16,25,54;--btn:#2f45ff;--bal1:#3a50ff;--bal2:#2236d6;--bar1:#7d8cff;
  --dangerbg:#fde9ea;--line:#e3e6f1;--grab:#cfd4e6;--fab:#ffc83d;--toast:#101936;--coin:#ffc83d;--coinink:#3b2a00;
  --fd:'Unbounded','Onest',system-ui,sans-serif;
}
html[data-theme=mint]{--bg:#ecf3f0;--ink:#0e2a26;--muted:#617a74;--pink:#4fb59d;--pink-d:#0f7d68;--pink-l:#d9eee7;--sh:14,42,38;--btn:#0f7d68;--bal1:#13917a;--bal2:#0b6454;--bar1:#4fb59d;--line:#dbe8e3;--grab:#c2d6cf;--toast:#0e2a26}
html[data-theme=lav]{--bg:#f2eff7;--ink:#241a3a;--muted:#7a7092;--pink:#a58be0;--pink-d:#6b3fd1;--pink-l:#e8e0f8;--sh:36,26,58;--btn:#6b3fd1;--bal1:#7a4fe0;--bal2:#5a2fb8;--bar1:#a58be0;--line:#e5def2;--grab:#d3c9e8;--toast:#241a3a}
html[data-theme=sky]{--bg:#eaf3f8;--ink:#0d2a3b;--muted:#5f7c8d;--pink:#4fb0d8;--pink-d:#0c7fae;--pink-l:#d6ecf6;--sh:13,42,59;--btn:#0c7fae;--bal1:#1493c4;--bal2:#0a6a93;--bar1:#4fb0d8;--line:#d9e8f0;--grab:#c1d7e3;--toast:#0d2a3b}
html[data-theme=dark]{--bg:#0d1226;--card:#161d38;--ink:#eef0fb;--muted:#8f98bd;--pink:#7d8cff;--pink-d:#98a5ff;--pink-l:#1f2849;--sh:0,0,0;--btn:#4a5eff;--bal1:#3347f0;--bal2:#1b2aa8;--bar1:#7d8cff;--dangerbg:#3a1f2b;--line:#242d50;--grab:#3a4472;--toast:#2a3460;--green:#2fc596;--red:#ff7a80}
html[data-theme=gra]{--bg:#111214;--card:#1b1c20;--ink:#f0f0f2;--muted:#9a9ca6;--pink:#c9a24a;--pink-d:#ffc24d;--pink-l:#26272d;--sh:0,0,0;--btn:#d98e0b;--bal1:#4a4d57;--bal2:#2c2e36;--bar1:#c9a24a;--dangerbg:#3a1f2b;--line:#2a2b31;--grab:#44464f;--toast:#2b2d34;--green:#2fc596;--red:#ff7a80}
html[data-theme=emd]{--bg:#07140e;--card:#0f2218;--ink:#e9f6ef;--muted:#86a799;--pink:#3fc08f;--pink-d:#4fd9a2;--pink-l:#173325;--sh:0,0,0;--btn:#14936a;--bal1:#17936a;--bal2:#0b5f44;--bar1:#3fc08f;--dangerbg:#3a1f2b;--line:#1b3528;--grab:#2c5440;--toast:#1c3a2c;--green:#2fc596;--red:#ff7a80}
html[data-theme=win]{--bg:#180c13;--card:#27141f;--ink:#fbeef3;--muted:#b392a1;--pink:#e0668f;--pink-d:#ff8fb2;--pink-l:#3a1c2b;--sh:0,0,0;--btn:#c23567;--bal1:#b22d5d;--bal2:#7a1a3f;--bar1:#e0668f;--dangerbg:#3a1f2b;--line:#3a1e2c;--grab:#5d3347;--toast:#42202f;--green:#2fc596;--red:#ff7a80}
html[data-theme=oce]{--bg:#061520;--card:#0e2433;--ink:#e8f4fb;--muted:#86a6ba;--pink:#3fb0e4;--pink-d:#5cc8f5;--pink-l:#143549;--sh:0,0,0;--btn:#1580b3;--bal1:#1a8cc2;--bal2:#0b5d86;--bar1:#3fb0e4;--dangerbg:#3a1f2b;--line:#173649;--grab:#2c566f;--toast:#183a50;--green:#2fc596;--red:#ff7a80}
html[data-theme=vio]{--bg:#120d22;--card:#1e1638;--ink:#f1ecff;--muted:#9d93be;--pink:#a284f7;--pink-d:#b9a1ff;--pink-l:#2b2150;--sh:0,0,0;--btn:#7c4ff0;--bal1:#7447e6;--bal2:#4b27ad;--bar1:#a284f7;--dangerbg:#3a1f2b;--line:#2a2150;--grab:#453a78;--toast:#2d2358;--green:#2fc596;--red:#ff7a80}
html[data-theme=emb]{--bg:#170e09;--card:#26160e;--ink:#fcf0e8;--muted:#b39784;--pink:#ec7a3c;--pink-d:#ff9a60;--pink-l:#3a2216;--sh:0,0,0;--btn:#d05a1c;--bal1:#c4531a;--bal2:#8a3510;--bar1:#ec7a3c;--dangerbg:#3a1f2b;--line:#3a2318;--grab:#5c3d2b;--toast:#432818;--green:#2fc596;--red:#ff7a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font-size:13.76px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
body{padding:1rem 1rem calc(var(--nav) + env(safe-area-inset-bottom) + 2.25rem)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:0.5rem 0.25rem 1.125rem}
.hi{color:var(--muted);font-size:1.0625rem;font-weight:600}
.title{font-size:1.75rem;font-weight:800;line-height:1.15}
.mnav{display:flex;gap:0.5rem}
.mnav button{width:2.375rem;height:2.375rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);font-size:1.25rem;font-weight:800;line-height:1}
.sec{display:flex;align-items:center;justify-content:space-between;margin:1.375rem 0.25rem 0.75rem}
.sec h2{font-size:1.3125rem;font-weight:800}
.sec a{color:var(--pink-d);font-weight:700;font-size:1rem;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:0.875rem;box-shadow:0 0.375rem 1.5rem rgba(var(--sh),.08);margin-bottom:0.75rem}
.gimg{position:relative;height:10.625rem;border-radius:1.25rem;overflow:hidden;background:linear-gradient(135deg,var(--pink-l),var(--pink))}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gimg .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.badge{position:absolute;left:0.875rem;top:0.875rem;background:var(--pink);color:#fff;font-weight:700;font-size:0.875rem;padding:0.5625rem 1rem;border-radius:1.25rem}
.ib{position:absolute;width:2.75rem;height:2.75rem;border-radius:50%;background:rgba(255,255,255,.88);color:var(--pink-d);display:flex;align-items:center;justify-content:center}
.ib.del{right:0.625rem;top:0.625rem}.ib.star{right:3.875rem;top:0.625rem}.ib.cam{right:0.625rem;bottom:0.625rem}
.grow{display:flex;align-items:center;justify-content:space-between;margin:1rem 0.375rem 0.25rem}
.gname{font-size:1.4375rem;font-weight:800;cursor:pointer}
.pill{background:var(--pink-l);color:var(--pink-d);font-weight:800;border-radius:1.125rem;padding:0.5rem 1rem;font-size:1rem}
.gsum{margin:0.25rem 0.375rem 0.75rem;font-size:1.125rem;font-weight:600;color:var(--muted)}
.gsum b{color:var(--ink);font-weight:700}
.gplan{margin:0 0.375rem 0.875rem;background:var(--pink-l);border-radius:1.125rem;padding:0.75rem 0.875rem;font-size:0.9375rem;font-weight:600;line-height:1.35;cursor:pointer}
.gplan b{font-weight:800}
.gplan small{display:block;font-size:0.875rem;color:var(--green);font-weight:700;margin-top:0.1875rem}
.gplan.neg small{color:var(--red)}
.gplan.hint{color:var(--muted);font-weight:600}
.preview{margin:0.875rem 0.25rem 0;background:var(--pink-l);border-radius:1.125rem;padding:0.75rem 0.875rem;font-weight:700;font-size:0.9375rem;line-height:1.4}
.preview.neg{color:var(--red)}
.bar{height:0.75rem;border-radius:0.625rem;background:var(--pink-l);overflow:hidden;margin:0 0.375rem 1rem}
.bar i{display:block;height:100%;border-radius:0.625rem;background:linear-gradient(90deg,var(--bar1),var(--pink-d));transition:width .4s}
.bar.over i{background:linear-gradient(90deg,#f19aae,var(--red))}
.btn{width:100%;background:var(--btn);color:#fff;font-weight:800;font-size:1.125rem;padding:0.9375rem;border-radius:1.375rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;box-shadow:0 0.5rem 1.25rem rgba(var(--sh),.25)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--pink-l);color:var(--pink-d);box-shadow:none}
.btn.danger{background:var(--dangerbg);color:var(--red);box-shadow:none}
.btn.big{margin-top:1.125rem}
.bal{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bal1),var(--bal2));color:#fff;border-radius:1.75rem;padding:1.25rem 1.125rem 1.125rem;margin-bottom:0.875rem;box-shadow:0 0.75rem 1.875rem rgba(var(--sh),.28)}
.bal:before{content:"";position:absolute;right:-4.375rem;top:-3.75rem;width:16.25rem;height:16.25rem;border-radius:50%;background:rgba(255,255,255,.12)}
.bal .lbl{display:flex;align-items:center;gap:0.625rem;font-size:1.125rem;font-weight:600;opacity:.95;position:relative}
.bal .big{font-size:2.875rem;font-weight:800;margin:0.75rem 0 1rem;letter-spacing:-1px;position:relative}
.bal .row{display:flex;gap:0.75rem;position:relative}
.bal .mini{flex:1;background:rgba(255,255,255,.2);border-radius:1.375rem;padding:0.875rem 1rem}
.bal .mini span{display:block;font-size:1rem;opacity:.9;font-weight:600}
.bal .mini b{font-size:1.375rem;font-weight:800}
.plan{display:flex;align-items:center;gap:1rem;cursor:pointer}
.plan .ico{width:3.625rem;height:3.625rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);display:flex;align-items:center;justify-content:center;flex:none}
.plan b{display:block;font-size:1.1875rem;font-weight:800}
.plan span{color:var(--muted);font-size:0.875rem;font-weight:600}
.cat .h{display:flex;align-items:center;gap:0.875rem;margin-bottom:0.75rem}
.cat .em{font-size:2.125rem;line-height:1;width:2.875rem;text-align:center}
.cat .nm{flex:1;font-size:1.3125rem;font-weight:800}
.edit{width:2.625rem;height:2.625rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);display:flex;align-items:center;justify-content:center}
.cat .amt{font-size:1.6875rem;font-weight:800;margin:0 0.25rem 0.625rem}
.cat .amt small{font-size:1.125rem;color:var(--muted);font-weight:600}
.cat .amt em{font-style:normal;font-size:1.125rem;font-weight:700;color:var(--green)}
.cat .amt em.neg{color:var(--red)}
.cat .foot{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:0.9375rem;margin:0 0.25rem}
.budget .n{font-size:2.375rem;font-weight:800;margin:0.25rem 0 0.75rem}
.budget .n small{font-size:1.625rem;color:var(--muted);font-weight:600}
.ok{color:var(--green);font-weight:700;font-size:1.0625rem}.ok.neg{color:var(--red)}
.pf{display:flex;gap:0.875rem;align-items:center}
.pf .em{font-size:2.125rem;width:2.875rem;text-align:center}
.pf .b{flex:1}
.pf .t{display:flex;justify-content:space-between;font-size:1.1875rem;font-weight:800;margin-bottom:0.5rem}
.pf .t span{font-size:1rem;font-weight:600}
.pf .bar{margin:0 0 0.5rem}
.pf .ok{font-size:0.9375rem}
.op{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 0.25rem;border-bottom:1px solid var(--line);cursor:pointer}
.op:last-child{border:0}
.op .em{font-size:1.75rem;width:2.5rem;text-align:center}
.op .m{flex:1}.op .m b{display:block;font-size:1.125rem}.op .m span{font-size:0.875rem;color:var(--muted);font-weight:600}
.op .a{font-weight:800;font-size:1.125rem}.op .a.in{color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:1.125rem 0.5rem;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:0.875rem}
.kpi{background:var(--card);border-radius:1.5rem;padding:1rem;box-shadow:0 0.375rem 1.5rem rgba(var(--sh),.08)}
.kpi span{display:block;color:var(--muted);font-weight:600;font-size:0.9375rem}
.kpi b{font-size:1.5rem;font-weight:800}
.kpi.w{grid-column:1/3}
.chart{display:flex;align-items:flex-end;gap:0.625rem;height:10.625rem;padding:0 0.25rem}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.5rem;height:100%;justify-content:flex-end}
.chart .bars{display:flex;align-items:flex-end;gap:0.25rem;height:100%;width:100%;justify-content:center}
.chart .bars i{display:block;width:42%;border-radius:0.5rem 0.5rem 0.25rem 0.25rem;min-height:0.1875rem}
.chart .bars .a{background:var(--pink-l)}.chart .bars .b{background:linear-gradient(180deg,var(--bar1),var(--pink-d))}
.chart label{font-size:0.875rem;color:var(--muted);font-weight:700}
.legend{display:flex;gap:1rem;margin:0.75rem 0.25rem 0;font-size:0.875rem;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:0.75rem;height:0.75rem;border-radius:0.25rem;margin-right:0.375rem;vertical-align:-1px}
.share{margin-bottom:0.875rem}.share .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:0.375rem;font-size:1.0625rem}
.share .bar{margin:0}
.set label,.panel label{display:block;margin:0.875rem 0.25rem 0.375rem;font-weight:700;color:var(--muted);font-size:0.9375rem}
input.f,.panel input{width:100%;font-size:max(16px,1.1rem);font-weight:600;padding:.8rem 1rem;border-radius:1rem;border:2px solid var(--pink-l);background:var(--card);color:var(--ink);outline:none}
input.f:focus,.panel input:focus{border-color:var(--pink)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-radius:1.875rem 1.875rem 0 0;display:flex;justify-content:space-around;box-shadow:0 -0.25rem 1.5rem rgba(var(--sh),.12);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0.125rem;font-size:0.8125rem;font-weight:700;color:var(--muted);padding:0.5rem 0.375rem;flex:1}
.nav button .i{width:3.25rem;height:2.25rem;border-radius:1.125rem;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--pink-d)}.nav button.on .i{background:var(--pink-l)}
.fab{position:fixed;right:1.25rem;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 1.125rem);width:3.75rem;height:3.75rem;border-radius:50%;background:var(--fab);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0.625rem 1.5rem rgba(var(--sh),.4);z-index:15}
.fab{transition:opacity .2s,transform .1s}
.fab:active{transform:scale(.94)}
#sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;pointer-events:none}
#sheet .back{position:absolute;inset:0;background:rgba(20,10,16,.45);opacity:0;transition:opacity .25s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:92%;background:var(--card);border-radius:1.5rem 1.5rem 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -.5rem 2rem rgba(0,0,0,.18)}
#sheet.on{pointer-events:auto}#sheet.on .back{opacity:1}#sheet.on .panel{transform:none}
.shead{flex:none;padding:.6rem 1.1rem .5rem;touch-action:none}
.grab{width:2.6rem;height:.3rem;border-radius:.2rem;background:var(--grab);margin:0 auto .7rem}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.panel h3{font-size:1.4rem;font-weight:800}
.x{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 1.1rem 1rem}
.sfoot{flex:none;padding:.7rem 1.1rem calc(.8rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sfoot .btn.big{margin:0}
.amtbox{display:flex;align-items:baseline;justify-content:center;gap:.4rem;margin:.9rem 0 .2rem}
.panel .amtbox input{width:auto;max-width:70%;border:0;background:transparent;text-align:center;font-size:max(28px,2.4rem);font-weight:800;padding:.2rem;border-radius:0}
.amtbox span{font-size:1.8rem;font-weight:800;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.6rem .3rem;min-height:4.4rem;border-radius:1rem;background:var(--pink-l);font-weight:700;font-size:.85rem;line-height:1.15;text-align:center;border:2px solid transparent}
.cg b{font-size:1.5rem;line-height:1;font-weight:400}
.cg.on{border-color:var(--pink-d);background:var(--card);box-shadow:0 .2rem .6rem rgba(var(--sh),.2)}
.row2{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row2 input[type=date]{flex:1;min-width:8rem;padding:.6rem .8rem}
.seg{display:flex;background:var(--pink-l);border-radius:1.25rem;padding:0.3125rem;margin:0.75rem 0 0.25rem}
.seg button{flex:1;padding:0.75rem;border-radius:1rem;font-weight:800;font-size:1.0625rem;color:var(--pink-d)}
.seg button.on{background:var(--card);box-shadow:0 0.1875rem 0.625rem rgba(var(--sh),.2)}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem}
.chip{padding:.55rem .85rem;border-radius:1rem;background:var(--pink-l);font-weight:700;font-size:.95rem}
.chip.on{background:var(--pink-d);color:#fff}
.plrow{display:flex;align-items:center;gap:0.625rem;margin-top:0.625rem}
.plrow .em{font-size:1.625rem;width:2.25rem;text-align:center}
.backlink{display:inline-block;margin:.2rem 0 .4rem;padding:.4rem .2rem;color:var(--pink-d);font-weight:800;font-size:1rem;cursor:pointer}
.plrow span{flex:1;font-weight:700;font-size:1.0625rem}
.plrow .pen{font-style:normal;color:var(--muted);font-size:.9rem;margin-left:.2rem}
.plrow input{width:8.125rem;text-align:right;padding:0.75rem 0.875rem}
.free{margin:.6rem 0 0;padding:.6rem .8rem;border-radius:1rem;background:var(--pink-l);font-weight:800;font-size:.95rem}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:0.625rem;margin-top:0.375rem}
.th{border-radius:1.375rem;padding:0.75rem 0.375rem;background:var(--pink-l);font-weight:700;font-size:0.875rem;display:flex;flex-direction:column;align-items:center;gap:0.5rem;border:0.1875rem solid transparent;color:var(--ink)}
.th.on{border-color:var(--pink-d)}
.th i{width:2.875rem;height:2.875rem;border-radius:50%;display:block;box-shadow:0 0.25rem 0.625rem rgba(0,0,0,.14)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 6.25rem);transform:translateX(-50%) translateY(1.25rem);background:var(--toast);color:#fff;padding:0.75rem 1.25rem;border-radius:1.25rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
#snack{position:fixed;left:1rem;right:1rem;bottom:calc(var(--nav) + 6.25rem);z-index:62;display:flex;align-items:center;gap:.75rem;padding:.6rem .6rem .6rem 1.1rem;border-radius:1.5rem;background:var(--toast);color:#fff;font-weight:700;opacity:0;transform:translateY(1rem);pointer-events:none;transition:.25s}
#snack.on{opacity:1;transform:none;pointer-events:auto}

var spentOf = function(k){ return sum(opsOf(k).filter(function(o){ return o.type === 'expense'; }).map(function(o){ return o.amount; })); };
var extraOf = function(k){ return sum(opsOf(k).filter(function(o){ return o.type === 'income'; }).map(function(o){ return o.amount; })); };
var baseIncome = function(k){ return S.income[k] != null ? S.income[k] : S.defaultIncome; };
var incomeOf = function(k){ return (workAuto(k) ? earnedOf(k) : baseIncome(k)) + extraOf(k); };
function workAuto(k){ var w = S.work; return !!(w && scope === 'me' && w.mode !== 'fixed' && w.auto !== false && k >= (w.since || realKey()) && workRate(w) > 0); }
function earnedOf(k){ var w = S.work; return Math.round(hoursOf(k) * workRate(w) + (w.bonus || 0)); }
var saved = function(g){ return sum(g.contribs.map(function(c){ return c.amount; })); };
var contribOf = function(k){ return sum(S.goals.map(function(g){ return sum(g.contribs.filter(function(c){ return c.date.slice(0,7) === k; }).map(function(c){ return c.amount; })); })); };
var leftOf = function(k){ return incomeOf(k) - spentOf(k) - contribOf(k); };
var catOps = function(k,id){ return opsOf(k).filter(function(o){ return o.type === 'expense' && o.catId === id; }); };
var catById = function(id){ return S.cats.filter(function(c){ return c.id === id; })[0]; };
var goalById = function(id){ return S.goals.filter(function(g){ return g.id === id; })[0]; };
var userName = function(){ return P().name || tgName || ''; };

/* ---------- UI helpers ---------- */
var toastT;
var UNDO_MS = 3000, snackT = null, snackI = null, undoFn = null;
function hideUndo(){ clearTimeout(snackT); clearInterval(snackI); undoFn = null; var e = $('#snack'); if (e) e.classList.remove('on'); }
function showUndo(text, fn){
  hideUndo(); undoFn = fn;
  var e = $('#snack'), sec = Math.round(UNDO_MS / 1000);
  e.style.setProperty('--sd', UNDO_MS + 'ms');
  e.innerHTML = '<span class="st">' + esc(text) + '</span><button class="und" data-act="undo" aria-label="Отменить"><span class="ring"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" cx="18" cy="18" r="15"/></svg><b>' + sec + '</b></span>Отменить</button>';
  void e.offsetHeight; e.classList.add('on');
  var left = sec; snackI = setInterval(function(){ left--; var b = e.querySelector('.ring b'); if (b && left > 0) b.textContent = left; }, 1000);
  snackT = setTimeout(hideUndo, UNDO_MS);
}
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2200); }
function fitSheet(){
  var el = $('#sheet'), vv = window.visualViewport;
  if (!vv || !el.classList.contains('on')) return;
  el.style.top = vv.offsetTop + 'px'; el.style.height = vv.height + 'px'; el.style.bottom = 'auto';
}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitSheet); window.visualViewport.addEventListener('scroll', fitSheet); }
function sheet(html){
  var tmp = document.createElement('div'); tmp.innerHTML = html;
  var h = tmp.querySelector('h3'), title = h ? h.textContent : ''; if (h) h.remove();
  var foot = ''; tmp.querySelectorAll('.btn.big:not(.danger)').forEach(function(b){ foot += b.outerHTML; b.remove(); });
  var el = $('#sheet');
  el.innerHTML = '<div class="back" data-close></div><div class="panel" role="dialog" aria-modal="true">' +
    '<div class="shead"><div class="grab"></div><div class="hrow"><h3>' + esc(title) + '</h3><button class="x" data-close aria-label="Закрыть">×</button></div></div>' +
    '<div class="sbody">' + tmp.innerHTML + '</div>' + (foot ? '<div class="sfoot">' + foot + '</div>' : '') + '</div>';
  void el.offsetHeight; el.classList.add('on'); fitSheet();

}
function closeSheet(){
  var el = $('#sheet'); el.classList.remove('on');
  el.style.top = ''; el.style.height = ''; el.style.bottom = '';
  var a = document.activeElement; if (a && a.blur && a !== document.body) a.blur();
}
function confirmBox(msg, cb){
  if (tg && tg.showConfirm) { try { tg.showConfirm(msg, function(ok){ if (ok) cb(); }); return; } catch(e){} }
  if (window.confirm(msg)) cb();
}

/* ---------- Серия дней, безопасная сумма, итоги месяца ---------- */
function dkey(x){ return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); }
function streakInfo(){
  var days = {}; S.ops.forEach(function(o){ if (!o.auto) days[o.date] = 1; });
  var now = new Date(), c = new Date(now), n = 0;
  var wrote = !!days[dkey(now)];
  if (!wrote) c.setDate(c.getDate() - 1);
  while (days[dkey(c)] && n < 3650) { n++; c.setDate(c.getDate() - 1); }
  return {n: n, today: wrote};
}
function debtLeft(d){ return Math.max(0, d.total - sum((d.payments || []).map(function(p){ return p.amount; }))); }
function upcomingBills(){
  var t = today(), k = curKey(), total = 0;
  (S.recurring || []).forEach(function(r){
    if (r.from && r.from > k) return;
    var date = k + '-' + pad(Math.min(r.day, dim()));
    if (date > t) total += r.amount;
  });
  (S.debts || []).forEach(function(d){
    if (d.kind === 'owed' || !(d.pay > 0) || debtLeft(d) <= 0) return;
    var date = k + '-' + pad(Math.min(d.day || 1, dim()));
    var paid = (d.payments || []).some(function(p){ return p.date.slice(0,7) === k; });
    if (date > t && !paid) total += Math.min(d.pay, debtLeft(d));
  });
  return total;
}
function safeToday(){
  if (!isCur()) return null;
  var k = curKey(), dl = daysLeft(), t = today();
  var spentToday = sum(S.ops.filter(function(o){ return o.type === 'expense' && o.date === t; }).map(function(o){ return o.amount; }));
  var left = leftOf(k) - upcomingBills();
  var allowance = (left + spentToday) / dl;
  return {left: left, dl: dl, allowance: allowance, rest: allowance - spentToday, bills: upcomingBills()};
}
function monthStats(k){
  var p = k.split('-'), prev = mk(+p[0], +p[1] - 2 < 0 ? 11 : +p[1] - 2);
  if (+p[1] - 2 < 0) prev = mk(+p[0] - 1, 11);
  var sp = spentOf(k), psp = spentOf(prev), cats = {}, big = null, spendDays = {};
  opsOf(k).forEach(function(o){
    if (o.type !== 'expense') return;
    cats[o.catId] = (cats[o.catId] || 0) + o.amount; spendDays[o.date] = 1;
    if (!big || o.amount > big.amount) big = o;
  });
  var top = Object.keys(cats).sort(function(a, b){ return cats[b] - cats[a]; })[0];
  var y = +p[0], m = +p[1] - 1, n = new Date(), ds = (n.getFullYear() === y && n.getMonth() === m) ? n.getDate() : new Date(y, m + 1, 0).getDate();
  return {k: k, prev: prev, sp: sp, psp: psp, hasPrev: psp > 0, top: top, topSum: top != null ? cats[top] : 0, big: big, free: ds - Object.keys(spendDays).length, days: ds, saved: contribOf(k), income: incomeOf(k)};
}
function summaryCard(k){
  var st = monthStats(k);
  if (st.sp <= 0 && st.saved <= 0) return '';
  var rows = [];
  if (st.hasPrev) { var diff = Math.round((st.sp - st.psp) / st.psp * 100); rows.push('<div class="srow"><span>К прошлому месяцу</span><b class="' + (diff > 0 ? 'neg' : 'pos') + '">' + (diff > 0 ? '+' : '') + diff + '%</b></div>'); }
  var tc = st.top != null ? catById(st.top) : null;
  if (tc) rows.push('<div class="srow"><span>Больше всего ушло на</span><b>' + esc(tc.name) + ' · ' + fmt(st.topSum) + '</b></div>');
  if (st.big) rows.push('<div class="srow"><span>Самая крупная трата</span><b>' + fmt(st.big.amount) + (st.big.note ? ' · ' + esc(st.big.note) : '') + '</b></div>');
  rows.push('<div class="srow"><span>Дней без трат</span><b>' + st.free + ' из ' + st.days + '</b></div>');
  if (st.saved > 0) rows.push('<div class="srow"><span>Отложено в цели</span><b class="pos">' + fmt(st.saved) + '</b></div>');
  var left = st.income - st.sp - st.saved;
  rows.push('<div class="srow"><span>' + (left >= 0 ? 'Остаток' : 'Ушли в минус') + '</span><b class="' + (left >= 0 ? 'pos' : 'neg') + '">' + fmt(Math.abs(left)) + '</b></div>');
  return '<div class="sec"><h2>Итоги месяца</h2></div><div class="card sumcard">' + rows.join('') + '</div>';
}
function streakChip(){
  var s = streakInfo();
  if (s.n === 0) return '<div class="streak off"><span class="ci sm">' + ic('flame', 16) + '</span><span>Запишите трату, чтобы начать серию</span></div>';
  return '<div class="streak"><span class="ci sm">' + ic('flame', 16) + '</span><span><b>' + s.n + ' ' + plural(s.n, ['день', 'дня', 'дней']) + ' подряд</b>' + (s.today ? '' : ' · запишите сегодня, чтобы не прервать') + '</span></div>';
}
function overNames(k){
  return S.cats.filter(function(c){ return c.limit > 0 && sum(catOps(k, c.id).map(function(o){ return o.amount; })) > c.limit; }).map(function(c){ return esc(c.name); });
}
function disGet(){ try { return localStorage.getItem('kp_dis') || ''; } catch (e) { return ''; } }
function alertCard(k){
  var f = safeToday(), over = overNames(k), neg = f && f.rest < 0, empty = f && f.left <= 0;
  var sig = today() + '|' + (empty ? 'e' : neg ? 'n' : '') + '|' + over.join(',');
  var bad = empty || neg || over.length;
  if (bad && disGet() === sig) return '';
  var x = bad ? '<button class="x" data-act="dismissal" data-sig="' + sig + '" aria-label="Скрыть до завтра">×</button>' : '';
  var lim = over.length ? '<span class="wl">Лимит превышен: ' + over.join(', ') + '</span>' : '';
  if (!f) return over.length ? '<div class="safe bad"><span class="ci sm">' + ic('shield', 18) + '</span><div><b>Лимит превышен</b><span>' + over.join(', ') + '</span></div>' + x + '</div>' : '';
  if (empty) return '<div class="safe bad"><span class="ci sm">' + ic('shield', 18) + '</span><div><b>Бюджет месяца исчерпан</b><span>Остаток с учётом платежей: ' + fmt(f.left) + '</span>' + lim + '</div>' + x + '</div>';
  var inf = 'По ' + fmt(f.allowance) + ' в день до конца месяца' + (f.bills > 0 ? ' · учтены платежи ' + fmt(f.bills) : '');
  if (!neg && over.length) return '<div class="safe bad"><span class="ci sm">' + ic('shield', 18) + '</span><div><b>Лимит превышен: ' + over.join(', ') + '</b><span>Сегодня можно потратить ' + fmt(f.rest) + ' · ' + inf + '</span></div>' + x + '</div>';
  return '<div class="safe' + (neg ? ' bad' : '') + '"><span class="ci sm">' + ic('shield', 18) + '</span><div><b>' + (neg ? 'Сегодня сверх нормы: ' + fmt(-f.rest) : 'Безопасно потратить сегодня: ' + fmt(f.rest)) + '</b><span>' + inf + '</span>' + lim + '</div>' + x + '</div>';
}
function summaryBanner(){
  var n = new Date(); if (n.getDate() > 3 || !isCur()) return '';
  var pk = mk(n.getFullYear(), n.getMonth() - 1 < 0 ? 11 : n.getMonth() - 1); if (n.getMonth() === 0) pk = mk(n.getFullYear() - 1, 11);
  if (spentOf(pk) <= 0 && contribOf(pk) <= 0) return '';
  return '<div class="plan slim" data-act="gosummary" data-k="' + pk + '">' + ic('chart', 20) + '<b>Итоги прошлого месяца готовы</b><span>›</span></div>';
}

/* ---------- Views ---------- */
function monthHeader(withHi){
  return '<div class="top"><div>' + (withHi ? '<div class="hi">' + (scope === 'fam' ? 'Семейный бюджет' : 'Привет' + (userName() ? ', ' + esc(userName()) : '')) + '</div>' : '<div class="hi">Месяц</div>') +
    '<div class="title" data-act="mpick">' + MONTHS[VM.m] + ' ' + VM.y + (monthKeys().length > 1 ? ' ▾' : '') + '</div></div>' +
    mnavHtml() + '</div>';
}

function monthBounds(){
  var rk = realKey(), lo = rk, hi = rk;
  function see(d){ if (!d) return; var k = String(d).slice(0,7); if (!/^\d{4}-\d{2}$/.test(k)) return; if (k < lo) lo = k; if (k > hi) hi = k; }
  S.ops.forEach(function(o){ see(o.date); });
  S.goals.forEach(function(g){ g.contribs.forEach(function(c){ see(c.date); }); });
  return {lo: lo, hi: hi};
}
function mnavHtml(){
  var b = monthBounds(), k = curKey();
  var many = b.lo < b.hi;
  return '<div class="mnav"><button data-act="mprev"' + (k <= b.lo ? ' disabled' : '') + ' aria-label="Предыдущий месяц">‹</button><button data-act="mnext"' + (k >= b.hi ? ' disabled' : '') + ' aria-label="Следующий месяц">›</button></div>';
}
function monthKeys(){
  var b = monthBounds(), out = [], p = b.hi.split('-'), y = +p[0], m = +p[1] - 1;
  while (mk(y, m) >= b.lo && out.length < 120) { out.push({y: y, m: m}); m--; if (m < 0) { m = 11; y--; } }
  return out;
}
function realKey(){ var n = new Date(); return mk(n.getFullYear(), n.getMonth()); }
function monthsSince(iso){
  var p = String(iso || today()).split('-'), n = new Date();
  return (n.getFullYear() - +p[0]) * 12 + (n.getMonth() - (+p[1] - 1));
}
function calcPlan(rest, months, inc){
  var per = Math.ceil(rest / months / 100) * 100;
  return {per: per, free: inc - per, inc: inc, over: per > inc};
}
function plan(g){
  if (!g.months) return null;
  var rest = g.target - saved(g);
  if (rest <= 0) return {done: true};
  var left = Math.max(1, g.months - monthsSince(g.start));
  var r = calcPlan(rest, left, baseIncome(realKey()));
  r.left = left; return r;
}
/* прогноз по цели: когда накопим при нынешнем темпе */
function goalForecast(g){
  var left = g.target - saved(g);
  if (left <= 0 || !g.contribs.length) return '';
  var first = g.contribs.reduce(function(m, c){ return c.date < m ? c.date : m; }, g.contribs[0].date).split('-');
  var now = new Date(), months = Math.max(1, (now.getFullYear() - +first[0]) * 12 + now.getMonth() - (+first[1] - 1) + 1);
  var per = saved(g) / months; if (per <= 0) return '';
  var n = Math.ceil(left / per), d = new Date(now.getFullYear(), now.getMonth() + n, 1);
  if (n > 120) return '';
  return '<div class="gfore">При вашем темпе (≈ '+fmt(per)+'/мес) накопите к '+MSHORT[d.getMonth()]+' '+d.getFullYear()+'</div>';
}
function planLine(g){
  var p = plan(g);
  if (!p) return '<div class="gplan hint" data-act="editgoal" data-id="'+g.id+'">Укажите срок — подскажу, сколько откладывать в месяц</div>';
  if (p.done) return '<div class="gplan"><b>Цель достигнута 🎉</b></div>';
  return '<div class="gplan '+(p.over ? 'neg' : '')+'" data-act="editgoal" data-id="'+g.id+'">Откладывать ≈ <b>'+fmt(p.per)+'</b>/мес · ещё '+p.left+' '+plural(p.left, ['месяц','месяца','месяцев']) +
    '<small>'+(p.over ? 'Больше зарплаты ('+fmt(p.inc)+') — увеличьте срок' : 'На жизнь останется ≈ '+fmt(p.free)+'/мес при зарплате '+fmt(p.inc))+'</small></div>';
}
function goalsSummary(){
  var tot = 0, n = 0, inc = baseIncome(realKey());
  S.goals.forEach(function(g){ var p = plan(g); if (p && !p.done) { tot += p.per; n++; } });
  if (!n) return '';
  var free = inc - tot;
  return '<div class="card"><div class="hi">Чтобы успеть по всем целям</div><div class="gsum" style="margin:0.375rem 0 0"><b>'+fmt(tot)+'</b> в месяц</div>' +
    '<div class="ok '+(free < 0 ? 'neg' : '')+'" style="font-size:1.0625rem;margin-top:0.375rem">'+(free < 0 ? 'Это больше зарплаты ('+fmt(inc)+')' : 'На жизнь останется ≈ '+fmt(free)+' из '+fmt(inc))+'</div></div>';
}

function goalCard(g, manage){
  var s = saved(g), p = pct(s, g.target), isMain = S.mainGoal === g.id;
  var img = g.img ? '<img src="'+g.img+'" alt="">' : '<div class="ph" style="color:#fff">'+ic('target',56)+'</div>';
  var tools = manage ? ((!isMain ? '<button class="ib star" data-act="maingoal" data-id="'+g.id+'" aria-label="Сделать основной">'+ic('star',22)+'</button>' : '') +
    '<button class="ib del" data-act="delgoal" data-id="'+g.id+'" aria-label="Удалить">'+ic('trash',22)+'</button>' +
    '<button class="ib cam" data-act="photo" data-id="'+g.id+'" aria-label="Фото">'+ic('camera',22)+'</button>') : '';
  return '<div class="card"><div class="gimg">'+img+(isMain ? '<span class="badge">Основная</span>' : '')+tools+'</div>' +
    '<div class="grow"><div class="gname" data-act="editgoal" data-id="'+g.id+'">'+esc(g.name)+'</div><span class="pill">'+p+'%</span></div>' +
    '<div class="gsum"><b>'+fmt(s)+'</b> из '+fmt(g.target)+'</div>' + planLine(g) + goalForecast(g) +
    '<div class="bar"><i style="width:'+p+'%"></i></div>' +
    '<button class="btn" data-act="contrib" data-id="'+g.id+'">'+ic('plus',22)+' Добавить</button></div>';
}

function catCard(c, k){
  var list = catOps(k, c.id), sp = sum(list.map(function(o){ return o.amount; }));
  var left = c.limit - sp, over = sp > c.limit;
  var w = c.limit > 0 ? Math.min(100, sp / c.limit * 100) : (sp > 0 ? 100 : 0);
  var sub = c.limit > 0 ? (over ? 'перерасход '+fmt(-left) : 'осталось '+fmt(left)) : (sp > 0 ? 'без лимита' : 'нет лимита');
  var hue = (S.cats.indexOf(c) * 47 + 20) % 360;
  return '<div class="card cat" style="--ch:'+hue+'" data-act="catadd" data-id="'+c.id+'"><div class="ch"><div class="em">'+ci(c.emoji)+'</div><div class="nm">'+esc(c.name)+'</div></div>' +
    '<div class="amt">'+fmt(sp)+'</div><div class="sub '+(c.limit > 0 ? (over ? 'neg' : 'left') : '')+'">'+sub+'</div>' +
    (c.limit > 0 ? '<div class="bar '+(over ? 'over' : '')+'"><i style="width:'+w+'%"></i></div>' : '') + '</div>';
}
function goalMini(g){
  var s = saved(g), p = pct(s, g.target);
  var th = g.img ? '<span class="gth"><img src="'+g.img+'" alt=""></span>' : ci('🎯','lg');
  return '<div class="card gmini"><div class="h">'+th+'<div class="mid"><div class="gname" data-act="editgoal" data-id="'+g.id+'">'+esc(g.name)+'</div><div class="sub"><b>'+fmt(s)+'</b> из '+fmt(g.target)+'</div></div>' +
    '<span class="pill">'+p+'%</span><button class="gadd" data-act="contrib" data-id="'+g.id+'" aria-label="Добавить в цель">'+ic('plus',22)+'</button></div>' +
    '<div class="bar"><i style="width:'+p+'%"></i></div></div>';
}

function vHome(){
  var k = curKey(), h = webBar() + monthHeader(true) + trialBar();
  var g = goalById(S.mainGoal) || S.goals[0];
  h += '<div class="bal"><div class="lbl">Осталось в этом месяце</div><div class="big">'+fmt(leftOf(k))+'</div>' +
    '<div class="row"><div class="mini tap" data-act="inclist"><span>Доход</span><b>'+fmt(incomeOf(k))+'</b></div><div class="mini tap" data-act="spentlist"><span>Потрачено</span><b>'+fmt(spentOf(k))+'</b></div></div></div>';
  h += alertCard(k) + streakChip() + summaryBanner();
  if (g) h += goalMini(g);
  h += workCard();
  h += '<div class="plan slim" data-act="plan">'+ic('calc',20)+'<b>Спланировать бюджет</b><span>›</span></div>';
  h += '<div class="sec"><h2>Категории</h2></div>';
  h += S.cats.length ? '<div class="hgrid">' + S.cats.map(function(c){ return catCard(c, k); }).join('') + '</div>' : '<div class="card empty">Категорий пока нет. Откройте «Спланировать бюджет» и добавьте их.</div>';
  return h + recentOps(k);
}

function opRow(o){
    var c = catById(o.catId), em = ci(o.type === 'income' ? '💰' : (c ? c.emoji : '•'));
    var title = o.note || (o.type === 'income' ? 'Доход' : (c ? c.name : 'Без категории'));
    var d = o.date.slice(8,10) + '.' + o.date.slice(5,7);
    return '<div class="op" data-act="delop" data-id="'+o.id+'"><div class="em">'+em+'</div><div class="m"><b>'+esc(title)+'</b><span>'+d+(o.note && c ? ' · '+esc(c.name) : '')+(o.fc ? ' · '+fmtc(o.fc.a, o.fc.c) : '')+authorTag(o)+'</span></div><div class="a '+(o.type === 'income' ? 'in' : '')+'">'+(o.type === 'income' ? '+' : '−')+fmt(o.amount)+'</div></div>';
}
function recentOps(k){
  var ops = opsOf(k).slice().sort(function(a,b){ return a.date === b.date ? b.t - a.t : (a.date < b.date ? 1 : -1); }).slice(0, 5);
  if (!ops.length) return '';
  return '<div class="sec"><h2>Последние операции</h2></div><div class="card">' + ops.map(opRow).join('') + '<div class="empty" style="padding-bottom:0.25rem;font-size:0.8125rem">Нажмите на операцию, чтобы удалить</div></div>';
}
function opsCard(k){

/* ---------- Sheets ---------- */
var opType = 'expense', opCat = '', pendingGoal = null, editId = null, pickedEmoji = '';

/* частые траты: нажал — сумма и категория подставились */
function recentChips(){
  var seen = {}, out = [];
  S.ops.slice().sort(function(a, b){ return (b.t || 0) - (a.t || 0); }).forEach(function(o){
    if (o.type !== 'expense' || out.length >= 5) return;
    var key = o.catId + '|' + o.amount; if (seen[key] || !catById(o.catId)) return;
    seen[key] = 1; out.push(o);
  });
  if (!out.length) return '';
  return '<div class="chips quick" id="f-recent">' + out.map(function(o){ var c = catById(o.catId);
    return '<button class="chip" data-act="opfill" data-cat="'+o.catId+'" data-amt="'+o.amount+'" data-note="'+esc(o.note || '')+'">'+ci(c.emoji,'sm')+' '+esc(o.note || c.name)+' · '+fmt(o.amount)+'</button>'; }).join('') + '</div>';
}
var opCur = 'RUB';
function curRow(){ return ""; }
function curRowOld(){
  var b = baseCode(), list = [b].concat(['USD','EUR','CNY','KZT','TRY','GEL'].filter(function(c){ return c !== b; }));
  return '<div class="chips" id="f-cur" style="margin:.1rem 0 .2rem">' + list.map(function(c){ return '<button class="chip ' + (c === opCur ? 'on' : '') + '" data-act="opcur" data-v="' + c + '">' + CURS[c][0] + ' ' + c + '</button>'; }).join('') + '</div><div class="fx" id="f-fx" style="display:none"></div>';
}
function updFx(){
  var box = $('#f-fx'); if (!box) return;
  var b = baseCode();
  if (opCur === b) { box.style.display = 'none'; return; }
  var inp = $('#f-rate'), a = num($('#f-amt').value), r = inp ? num(inp.value) : 0;
  if (!inp) {
    var rt = rateFor(opCur);
    box.innerHTML = '<span>1 ' + CURS[opCur][0] + ' =</span><input id="f-rate" inputmode="decimal" value="' + (rt ? String(Math.round(rt * 10000) / 10000) : '') + '" placeholder="курс"><span>' + SYM() + '</span><span id="f-conv" style="margin-left:auto"></span>';
    r = rt;
  }
  box.style.display = 'flex';
  var cv = $('#f-conv'); if (cv) cv.textContent = a > 0 && r > 0 ? '≈ ' + fmt(a * r) : (r > 0 ? '' : 'укажите курс');
}
function openOp(catId){
  opType = 'expense'; opCur = baseCode(); opCat = (catId && catById(catId)) ? catId : (S.cats[0] ? S.cats[0].id : '');
  var d = isCur() ? today() : mk(VM.y, VM.m) + '-01';
  sheet('<h3>Новая операция</h3>' +
    '<div class="seg"><button class="on" data-act="optype" data-v="expense">Расход</button><button data-act="optype" data-v="income">Доход</button></div>' +
    '<div class="amtbox"><input id="f-amt" inputmode="decimal" placeholder="0" autocomplete="off"><span id="f-sym">'+SYM()+'</span></div>' + curRow() + recentChips() +
    '<div id="f-cats"><label>Категория</label><div class="cgrid">' + S.cats.map(function(c){ return '<button class="cg '+(c.id === opCat ? 'on' : '')+'" data-act="opcat" data-id="'+c.id+'"><b>'+ci(c.emoji)+'</b>'+esc(c.name)+'</button>'; }).join('') + '</div></div>' +
    '<label>Комментарий</label><input id="f-note" placeholder="Необязательно" autocomplete="off">' +
    '<label>Дата</label><div class="row2"><button class="chip '+(isCur() ? 'on' : '')+'" data-act="opdate" data-v="0">Сегодня</button><button class="chip" data-act="opdate" data-v="1">Вчера</button><input id="f-date" type="date" value="'+d+'"></div>' +
    '<button class="btn big" data-act="saveop">Сохранить</button>');
  setTimeout(function(){ var a = $('#f-amt'); if (a) a.focus(); }, 320);
}

var backToPlan = false;
function commitPlan(){
  if (!$('#p-inc')) return;
  S.income[curKey()] = num($('#p-inc').value);
  document.querySelectorAll('.plim').forEach(function(i){ var c = catById(i.dataset.id); if (c) c.limit = num(i.value); });
  save();
}
function afterCat(){ var b = backToPlan; backToPlan = false; closeSheet(); render(); if (b) setTimeout(openPlan, 120); }
function openPlan(){
  var k = curKey();
  sheet('<h3>Бюджет на '+MONTHS[VM.m].toLowerCase()+'</h3><label>Доход на месяц, '+SYM()+'</label><input id="p-inc" inputmode="decimal" value="'+baseIncome(k)+'">' +
    '<div class="free" id="p-free"></div>' +
    '<label>Категории и лимиты</label>' + S.cats.map(function(c){ return '<div class="plrow"><div class="em" data-act="editcat" data-id="'+c.id+'">'+ci(c.emoji)+'</div><span data-act="editcat" data-id="'+c.id+'">'+esc(c.name)+' <i class="pen">✎</i></span><input class="plim" data-id="'+c.id+'" inputmode="decimal" value="'+c.limit+'"></div>'; }).join('') +
    '<button class="btn ghost" style="margin-top:.8rem" data-act="newcat">+ Новая категория</button>' +
    '<button class="btn big" data-act="saveplan">Сохранить</button>');
  updPlan();
}
function updPlan(){
  var el = $('#p-free'); if (!el) return;
  var tot = 0; document.querySelectorAll('.plim').forEach(function(i){ tot += num(i.value); });
  var f = num($('#p-inc').value) - tot;
  el.textContent = f >= 0 ? 'Не распределено: ' + fmt(f) + ' (можно отложить на цели)' : 'Лимиты превышают доход на ' + fmt(-f);
  el.style.color = f >= 0 ? 'var(--green)' : 'var(--red)';
}

function openCat(id){
  editId = id || null; var c = id ? catById(id) : null; pickedEmoji = c ? c.emoji : EMOJIS[0];
  var have = {}; S.cats.forEach(function(x){ have[x.name] = 1; });
  var pr = PRESETS.filter(function(x){ return !have[x[0]]; });
  var quick = (!c && pr.length) ? '<label>Быстро добавить (нажмите на нужные)</label><div class="chips">' + pr.map(function(x){ return '<button class="chip" data-act="addpreset" data-n="'+esc(x[0])+'" data-e="'+x[1]+'">'+ci(x[1],'sm')+' '+esc(x[0])+'</button>'; }).join('') + '</div>' : '';
  sheet('<h3>'+(c ? 'Категория' : 'Новая категория')+'</h3>'+quick+'<label>'+(c ? 'Название' : 'Или создайте свою · название')+'</label><input id="c-name" value="'+esc(c ? c.name : '')+'" placeholder="Например, Кафе">' +
    '<label>Значок</label><input id="c-em" value="'+esc(pickedEmoji)+'" maxlength="4"><div class="chips" style="margin-top:0.625rem">' + EMOJIS.map(function(e){ return '<button class="chip" data-act="pickem" data-v="'+e+'" aria-label="'+e+'">'+ci(e)+'</button>'; }).join('') + '</div>' +
    '<label>Лимит в месяц, '+SYM()+'</label><input id="c-lim" inputmode="decimal" value="'+(c ? c.limit : '')+'" placeholder="0">' +
    '<button class="btn big" data-act="savecat">Сохранить</button>' + (c ? '<button class="btn danger big" style="margin-top:0.625rem" data-act="delcat" data-id="'+c.id+'">Удалить категорию</button>' : ''));
}

var GOAL_IDEAS = ['Ноутбук','Отпуск','Машина','Квартира','Подушка безопасности','Ремонт','Телефон','Свадьба'];
function openGoal(id){
  editId = id || null; var g = id ? goalById(id) : null;
  var ideas = g ? '' : '<div class="chips" style="margin:0.625rem 0 0">' + GOAL_IDEAS.map(function(x){ return '<button class="chip" data-act="gidea" data-v="'+x+'">'+x+'</button>'; }).join('') + '</div>';
  sheet('<h3>'+(g ? 'Цель' : 'На что копим?')+'</h3><label>На что хотите накопить</label><input id="g-name" value="'+esc(g ? g.name : '')+'" placeholder="Например, Отпуск">' + ideas +
    '<label>Сколько нужно, '+SYM()+'</label><input id="g-target" inputmode="decimal" value="'+(g ? g.target : '')+'" placeholder="100000">' +
    '<label>За сколько месяцев</label><input id="g-months" inputmode="numeric" value="'+(g && g.months ? g.months : '')+'" placeholder="Например, 6">' +
    '<div class="chips" style="margin-top:0.625rem">' + [3,6,12,24].map(function(m){ return '<button class="chip" data-act="gmonths" data-v="'+m+'">'+m+' мес</button>'; }).join('') + '</div>' +
    '<div class="preview" id="g-prev"></div><button class="btn big" data-act="savegoal">Сохранить</button>');
  updGoal();
}
function updGoal(){
  var el = $('#g-prev'); if (!el) return;
  var tg_ = num($('#g-target').value), mo = Math.round(num($('#g-months').value)), g = editId ? goalById(editId) : null;
  var rest = tg_ - (g ? saved(g) : 0), inc = baseIncome(realKey());
  el.classList.remove('neg');
  if (tg_ <= 0 || mo <= 0) { el.textContent = 'Введите сумму и срок — посчитаю, сколько откладывать в месяц при зарплате ' + fmt(inc) + '.'; return; }
  if (rest <= 0) { el.textContent = 'Эта сумма уже накоплена 🎉'; return; }
  var r = calcPlan(rest, mo, inc);
  if (r.over) {
    var need = Math.ceil(rest / (inc * 0.3));
    el.classList.add('neg');
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес — это больше зарплаты (' + fmt(inc) + '). Реалистичнее копить около ' + need + ' ' + plural(need, ['месяц','месяца','месяцев']) + ' (30% зарплаты).';
  } else {
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес (' + Math.round(r.per / inc * 100) + '% зарплаты). На жизнь останется ≈ ' + fmt(r.free) + '/мес при зарплате ' + fmt(inc) + '.';
  }
}

function openContrib(id){
  editId = id; var g = goalById(id); if (!g) return;
  sheet('<h3>'+esc(g.name)+'</h3><div class="hi" style="margin:.2rem 0 0">Накоплено '+fmt(saved(g))+' из '+fmt(g.target)+'</div>' +
    '<div class="amtbox"><input id="k-amt" inputmode="decimal" placeholder="0" autocomplete="off"><span>'+SYM()+'</span></div>' +
    '<div class="chips" style="justify-content:center">' + [1000,5000,10000,20000].map(function(v){ return '<button class="chip" data-act="kadd" data-v="'+v+'">+ '+v.toLocaleString('ru-RU')+'</button>'; }).join('') + '</div>' +
    '<div class="preview" id="k-prev" style="display:none;text-align:center"></div>' +
    '<div class="hi" style="margin:.7rem 0 0;font-size:.85rem;text-align:center">Чтобы забрать деньги из цели, введите сумму со знаком «−»</div>' +
    '<button class="btn big" data-act="savecontrib">Добавить</button>');
  setTimeout(function(){ var a = $('#k-amt'); if (a) a.focus(); }, 320);
}
function updContrib(){
  var el = $('#k-prev'), g = goalById(editId); if (!el || !g) return;
  var a = num($('#k-amt').value), after = saved(g) + a;
  if (a === 0) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = after < 0 ? 'В цели нет столько денег' : 'После: ' + fmt(after) + ' из ' + fmt(g.target) + ' (' + pct(after, g.target) + '%)';
}

function convertAll(k){
  var r = function(x){ return Math.round((+x || 0) * k * 100) / 100; };
  (S.ops || []).forEach(function(o){ o.amount = r(o.amount); });
  S.defaultIncome = r(S.defaultIncome);
  Object.keys(S.income || {}).forEach(function(m){ S.income[m] = r(S.income[m]); });
  (S.cats || []).forEach(function(c){ c.limit = r(c.limit); });
  (S.goals || []).forEach(function(g){ g.target = r(g.target); (g.contribs || []).forEach(function(c){ c.amount = r(c.amount); }); });
  (S.recurring || []).forEach(function(x){ x.amount = r(x.amount); });
  (S.debts || []).forEach(function(d){ d.total = r(d.total); d.pay = r(d.pay); (d.payments || []).forEach(function(p){ p.amount = r(p.amount); }); });
}

/* ---------- Actions ---------- */
var ACT = {
  mprev: function(){ var b = monthBounds(); if (curKey() <= b.lo) return; VM.m--; if (VM.m < 0) { VM.m = 11; VM.y--; } render(); },
  mnext: function(){ var b = monthBounds(); if (curKey() >= b.hi) return; VM.m++; if (VM.m > 11) { VM.m = 0; VM.y++; } render(); },
  setcur: function(d){
    if (d.v === baseCode()) return;
    var old = baseCode(), has = S.ops.length > 0 || S.goals.length > 0 || (S.debts || []).length > 0;
    var go = function(k){
      if (k && k !== 1) convertAll(k);
      S.cur = d.v;
      if (k && k !== 1) (S.ops || []).forEach(function(o){ if (o.fc && o.fc.a) o.fc.r = Math.round(o.amount / o.fc.a * 1e6) / 1e6; });
      save(); render(); toast('Валюта: ' + CURS[d.v][0] + ' ' + d.v);
    };
    if (!has) { go(0); return; }
    S.cur = d.v; var k = rateFor(old); S.cur = old;
    if (k) confirmBox('Сменить валюту учёта на ' + d.v + '? Все суммы пересчитаются по курсу ЦБ: 1 ' + old + ' = ' + (Math.round(k * 10000) / 10000) + ' ' + d.v + '.', function(){ go(k); });
    else confirmBox('Курс сейчас недоступен. Сменить валюту на ' + d.v + ' без пересчёта (изменится только значок)?', function(){ go(0); });
  },
  gosummary: function(d){ var p = d.k.split('-'); VM.y = +p[0]; VM.m = +p[1] - 1; TAB = 'an'; window.scrollTo(0, 0); render(); },
  newdebt: function(){ if ((S.debts || []).length >= 1 && gate('Несколько долгов')) return; openDebt(); },
  editdebt: function(d){ openDebt(d.id); },
  dkind: function(d, el){ dKind = d.v; document.querySelectorAll('#d-kind button').forEach(function(b){ b.classList.toggle('on', b === el); }); },
  savedebt: function(){
    var name = $('#d-name').value.trim(), total = num($('#d-total').value), pay = num($('#d-pay').value), day = Math.round(num($('#d-day').value)) || 1, rate = num($('#d-rate').value);
    if (!name) { toast('Введите название'); return; }
    if (total <= 0) { toast('Введите сумму долга'); return; }
    day = Math.max(1, Math.min(28, day));
    if (!Array.isArray(S.debts)) S.debts = [];
    var d = dId ? S.debts.filter(function(x){ return x.id === dId; })[0] : null;
    if (d) { d.kind = dKind; d.name = name; d.total = total; d.pay = pay; d.day = day; d.rate = rate; }
    else S.debts.push({id: uid(), kind: dKind, name: name, total: total, pay: pay, day: day, rate: rate, payments: [], t: Date.now()});
    save(); closeSheet(); render(); toast('Сохранено');
  },
  deldebt: function(d){
    var x = S.debts.filter(function(y){ return y.id === d.id; })[0]; if (!x) return;
    confirmBox('Удалить «' + x.name + '»? Уже записанные платежи в расходах останутся.', function(){ S.debts = S.debts.filter(function(y){ return y.id !== x.id; }); save(); closeSheet(); render(); });
  },
  undopay: function(d){
    var x = S.debts.filter(function(y){ return y.id === d.id; })[0]; if (!x || !x.payments.length) return;
    var p = x.payments[x.payments.length - 1];
    confirmBox('Отменить платёж ' + fmt(p.amount) + ' от ' + p.date.slice(8,10) + '.' + p.date.slice(5,7) + '? Он пропадёт и из расходов.', function(){ removeDebtPay(x, p); save(); closeSheet(); render(); toast('Платёж отменён'); });
  },
  debtpay: function(d){
    var x = S.debts.filter(function(y){ return y.id === d.id; })[0]; if (!x) return; dpId = x.id;
    var left = debtLeft(x), def = x.pay > 0 ? Math.min(x.pay, left) : left;
    sheet('<h3>' + (x.kind === 'owed' ? 'Возврат долга' : 'Платёж') + '</h3><div class="hi" style="margin:.1rem .25rem .6rem;font-weight:600">' + esc(x.name) + ' · осталось ' + fmt(left) + '</div>' +
      '<div class="amtbox"><input id="dp-amt" inputmode="decimal" value="' + (def || '') + '" placeholder="0" autocomplete="off"><span>' + SYM() + '</span></div>' +
      '<label>Дата</label><input class="f" id="dp-date" type="date" value="' + today() + '">' +
      '<button class="btn big" data-act="savedebtpay">Записать</button>');
  },
  savedebtpay: function(){
    var x = S.debts.filter(function(y){ return y.id === dpId; })[0]; if (!x) return;
    var a = num($('#dp-amt').value), left = debtLeft(x), date = $('#dp-date').value || today();
    if (a <= 0) { toast('Введите сумму'); return; }
    if (a > left) a = left;
    var cat = S.cats.filter(function(c){ return c.name === 'Кредиты'; })[0], owed = x.kind === 'owed';
    var op = {id: uid(), type: owed ? 'income' : 'expense', amount: a, catId: owed || !cat ? '' : cat.id, note: (owed ? 'Возврат: ' : 'Платёж: ') + x.name, date: date, t: Date.now(), by: tgUser ? tgUser.id : 0, debt: x.id};
    S.ops.push(op); x.payments.push({id: uid(), date: date, amount: a, opId: op.id});
    save(); closeSheet(); haptic('medium'); render(); toast(debtLeft(x) <= 0 ? 'Долг погашен 🎉' : 'Платёж записан');
  },
  mpick: function(el){
    var ks = monthKeys(); if (ks.length < 2) return;
    sheet('<h3>Выберите месяц</h3><div class="mlist">' + ks.map(function(x){
      var k = mk(x.y, x.m);
      return '<button class="mrow' + (k === curKey() ? ' on' : '') + '" data-act="mgo" data-y="' + x.y + '" data-m="' + x.m + '"><span>' + MONTHS[x.m] + ' ' + x.y + '</span><b>' + fmt(spentOf(k)) + '</b></button>';
    }).join('') + '</div>');
  },
  mgo: function(d){ VM.y = +d.y; VM.m = +d.m; closeSheet(); render(); },
  addop: function(){ openOp(); },
  catadd: function(d){ openOp(d.id); },
  opensettings: function(){ TAB = 'set'; window.scrollTo(0, 0); render(); },
  backprof: function(){ TAB = 'prof'; window.scrollTo(0, 0); render(); },
  undo: function(){ var f = undoFn; hideUndo(); if (f) f(); },
  plan: function(){ backToPlan = false; openPlan(); },
  newcat: function(){ commitPlan(); backToPlan = true; openCat(); },
  editcat: function(d){ commitPlan(); backToPlan = true; openCat(d.id); },
  newgoal: function(){ if (S.goals.length >= 1 && gate('Несколько целей')) return; openGoal(); },
  editgoal: function(d){ openGoal(d.id); },
  contrib: function(d){ openContrib(d.id); },
  maingoal: function(d){ S.mainGoal = d.id; save(); haptic(); render(); },
  delgoal: function(d){
    var g = goalById(d.id); if (!g) return;
    confirmBox('Удалить цель «' + g.name + '»?', function(){
      S.goals = S.goals.filter(function(x){ return x.id !== d.id; });
      if (S.mainGoal === d.id) S.mainGoal = S.goals[0] ? S.goals[0].id : '';
      save(); render();
    });
  },
  photo: function(d){ pendingGoal = d.id; $('#file').click(); },
  delop: function(d){
    confirmBox('Удалить эту операцию?', function(){ var gone = S.ops.filter(function(o){ return o.id === d.id; })[0]; S.ops = S.ops.filter(function(o){ return o.id !== d.id; }); save(); render(); if (gone) showUndo('Операция удалена', function(){ S.ops.push(gone); save(); render(); toast('Возвращено'); }); });
  },
  optype: function(d, el){
    opType = d.v;
    document.querySelectorAll('#sheet .seg button').forEach(function(b){ b.classList.toggle('on', b === el); });
    $('#f-cats').style.display = opType === 'expense' ? '' : 'none';
  },
  opfill: function(d){
    if (opType !== 'expense') ACT.optype({v: 'expense'});
    ACT.opcat({id: d.cat});
    $('#f-amt').value = d.amt; $('#f-note').value = d.note || '';
  },
  opcat: function(d){
    opCat = d.id;
    document.querySelectorAll('[data-act="opcat"]').forEach(function(b){ b.classList.toggle('on', b.dataset.id === opCat); });
  },
  opdate: function(d, el){
    var dt = new Date(); dt.setDate(dt.getDate() - Number(d.v));
    $('#f-date').value = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    document.querySelectorAll('[data-act="opdate"]').forEach(function(b){ b.classList.toggle('on', b === el); });
  },
  kadd: function(d){ var i = $('#k-amt'); i.value = String(num(i.value) + Number(d.v)); updContrib(); },
  opcur: function(d, el){
    opCur = d.v;
    document.querySelectorAll('#f-cur .chip').forEach(function(b){ b.classList.toggle('on', b === el); });
    var fx = $('#f-fx'); if (fx) fx.innerHTML = '';
    var sy = $('#f-sym'); if (sy) sy.textContent = CURS[opCur][0];
    updFx();
  },
  saveop: function(){
    var a = num($('#f-amt').value), fc = null;
    if (a <= 0) { toast('Введите сумму'); return; }
    if (opCur !== baseCode()) {
      var rt = num(($('#f-rate') || {}).value);
      if (rt <= 0) { toast('Укажите курс'); return; }
      fc = {c: opCur, a: a, r: rt}; a = Math.round(a * rt * 100) / 100;
    }
    var date = $('#f-date').value || today();
    var limitMsg = '';
    if (opType === 'expense') {
      var cc = catById(opCat);
      if (cc && cc.limit > 0) {
        var bf = sum(catOps(date.slice(0,7), cc.id).map(function(o){ return o.amount; })), af = bf + a;
        if (af > cc.limit && bf <= cc.limit) limitMsg = '⚠️ Лимит по «' + cc.name + '» превышен';
        else if (af >= cc.limit * 0.8 && bf < cc.limit * 0.8) limitMsg = 'Почти лимит по «' + cc.name + '»: ' + Math.round(af / cc.limit * 100) + '%';
      }

var NOFMT = {'f-rate': 1, 's-h': 1, 'd-rate': 1};
function fmtField(el){
  if (!el || el.tagName !== 'INPUT' || el.getAttribute('inputmode') !== 'decimal' || NOFMT[el.id]) return;
  var v = el.value, pos = el.selectionStart, digitsBefore = pos == null ? null : v.slice(0, pos).replace(/[^\d]/g, '').length;
  var m = /^([\d\s]*)([.,]?)(\d*)$/.exec(v.replace(/ /g, ' ')); if (!m) return;
  var ip = m[1].replace(/\s/g, ''); if (ip.length < 4 && !/\s/.test(m[1])) return;
  var out = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + m[2] + m[3];
  if (out === v) return;
  el.value = out;
  if (digitsBefore != null && el === document.activeElement) {
    var n = 0, i = 0; while (i < out.length && n < digitsBefore) { if (/\d/.test(out.charAt(i))) n++; i++; }
    try { el.setSelectionRange(i, i); } catch (x) {}
  }
}
function fmtAllFields(root){ (root || document).querySelectorAll('input[inputmode="decimal"]').forEach(function(el){ if (el.value) fmtField(el); }); }
document.addEventListener('input', function(e){
  fmtField(e.target);

  if (w.mode === 'rate') return w.rate || 0;
  var mid = w.min && w.max ? (w.min + w.max) / 2 : (w.max || w.min || 0);
  return mid / WORK_NORM;
}
function hoursOf(k){ return sum(((S.work && S.work.shifts) || []).filter(function(x){ return x.date.slice(0,7) === k; }).map(function(x){ return x.h; })); }
function fmtH(h){ h = Math.round(h * 10) / 10; return String(h).replace('.', ',') + ' ч'; }
function shiftHours(from, to){
  var a = /^(\d{1,2}):(\d{2})$/.exec(from || ''), b = /^(\d{1,2}):(\d{2})$/.exec(to || '');
  if (!a || !b) return 0;
  var m = (+b[1] * 60 + +b[2]) - (+a[1] * 60 + +a[2]); if (m <= 0) m += 1440;
  return Math.round(m / 6) / 10;
}
function workCalc(k){
  var w = S.work; if (!w) return null;
  var rate = workRate(w); if (rate <= 0) return {rate: 0, worked: hoursOf(k)};
  var g = goalById(S.mainGoal), p = g ? plan(g) : null, goalPer = p && !p.done ? p.per : 0;
  var limits = sum(S.cats.map(function(c){ return c.limit > 0 ? c.limit : 0; }));
  var basics = Math.max(limits, spentOf(k) + upcomingBills());
  var bonus = w.bonus || 0, worked = hoursOf(k);
  var needB = Math.max(0, basics - bonus) / rate, needG = Math.max(0, basics + goalPer - bonus) / rate;
  var dl = daysLeft();
  var remB = Math.max(0, needB - worked), remG = Math.max(0, needG - worked);
  return {rate: rate, worked: worked, basics: basics, goalPer: goalPer, bonus: bonus, needB: needB, needG: needG, remB: remB, remG: remG, dl: dl, perDay: dl ? remG / dl : 0, earned: worked * rate};
}
function workCard(){
  if (scope !== 'me') return '';
  var w = S.work;
  if (!w) {
    if (workDis()) return '';
    return '<div class="plan slim wq" data-act="workset">' + ic('clock', 20) + '<b>Какая у вас зарплата: есть ставка или нет?</b><button class="x" data-act="workdis" aria-label="Скрыть">×</button></div>';
  }
  var k = curKey(), c = w.mode === 'fixed' ? {rate: 1, worked: hoursOf(k), fixed: true} : workCalc(k);
  var h = '<div class="card wk"><div class="wh">' + ic('clock', 20) + '<b>Часы</b><button class="gadd" data-act="newshift" aria-label="Записать смену">' + ic('plus', 22) + '</button></div>';
  if (!c || c.rate <= 0) return h + '<div class="wnote" data-act="workset">Укажите ставку или диапазон дохода, чтобы считать часы</div></div>';
  h += '<div class="wrow"><span>Отработано в этом месяце</span><b>' + fmtH(c.worked) + '</b></div>';
  if (c.fixed) return h + '<button class="btn ghost wedit" data-act="workset">' + ic('gear', 18) + ' Изменить</button><div class="wnote">Зарплата фиксированная: доход от часов не зависит</div></div>';
  if (workAuto(k)) h += '<div class="wrow"><span>Доход месяца по часам' + (c.bonus ? ' (с премией)' : '') + '</span><b>' + fmt(earnedOf(k)) + '</b></div>';
  else if (c.worked > 0) h += '<div class="wrow" data-act="applyearn" style="cursor:pointer"><span>Заработано по часам' + (c.bonus ? ' с премией' : '') + '</span><b>≈ ' + fmt(Math.round(c.earned + c.bonus)) + ' ›</b></div>';
  if (isCur()) {
    h += '<div class="wrow"><span>На базовые расходы (' + fmt(c.basics) + ')</span><b>' + fmtH(c.needB) + (c.remB > 0 ? ' · ещё ' + fmtH(c.remB) : ' ✓') + '</b></div>';
    if (c.goalPer > 0) h += '<div class="wrow"><span>И на цель (' + fmt(c.goalPer) + ')</span><b>' + fmtH(c.needG) + (c.remG > 0 ? ' · ещё ' + fmtH(c.remG) : ' ✓') + '</b></div>';
    if (c.remG > 0 && c.dl) h += '<div class="wrow"><span>В среднем в день до конца месяца</span><b>' + fmtH(c.perDay) + '</b></div>';
  }
  h += '<button class="btn ghost wedit" data-act="workset">' + ic('gear', 18) + ' Изменить ставку и доход</button><div class="wnote">' + (w.mode === 'rate' ? 'Ставка ' + fmt(w.rate) + '/ч' : 'Оценка ≈ ' + fmt(Math.round(c.rate)) + '/ч (доход ' + fmt(w.min || w.max) + (w.min && w.max && w.max !== w.min ? '–' + fmt(w.max) : '') + ')') + (c.bonus ? ' · премия ' + fmt(c.bonus) : '') + '</div></div>';
  return h;
}
function workListCard(){
  if (!S.work) return '';
  var list = S.work.shifts.slice().sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }).slice(0, 10);
  return '<div class="card set"><label style="margin-top:0">Смены</label>' +
    (list.length ? list.map(function(x){ return '<div class="rec" data-act="editshift" data-id="' + x.id + '"><div>' + x.date.slice(8,10) + '.' + x.date.slice(5,7) + '<br><span>' + (x.from && x.to ? x.from + ' – ' + x.to : 'без времени') + '</span></div><div style="display:flex;align-items:center;gap:.6rem"><b>' + fmtH(x.h) + '</b><span class="edpill">Изменить</span></div></div>'; }).join('') +
      '<div class="hi" style="margin:.4rem .25rem .6rem;font-size:.8rem;font-weight:600">Нажмите на смену, чтобы изменить или удалить</div>' : '<div class="hi" style="margin:0 .25rem .6rem;font-weight:600">Смен пока нет.</div>') +
    '<button class="btn ghost" data-act="newshift">' + ic('plus', 22) + ' Записать смену</button></div>';
}
function openWork(){
  var w = S.work || {mode: 'rate', rate: 0, min: 0, max: 0, bonus: 0};
  workMode = w.mode; workAuto0 = w.auto !== false;
  sheet('<h3>Рабочие часы</h3><label>Есть ли ставка?</label><div class="chips">' +
    '<button class="chip ' + (w.mode === 'rate' ? 'on' : '') + '" data-act="wmode" data-v="rate">Есть ставка за час</button>' +
    '<button class="chip ' + (w.mode === 'range' ? 'on' : '') + '" data-act="wmode" data-v="range">Нет ставки</button>' +
    '<button class="chip ' + (w.mode === 'fixed' ? 'on' : '') + '" data-act="wmode" data-v="fixed">Фиксированная зарплата</button></div>' +
    '<div id="w-fixed" class="hi" style="margin:.6rem .25rem 0;font-weight:600;' + (w.mode === 'fixed' ? '' : 'display:none') + '">Доход остаётся как в настройках, часы идут только для учёта. Премию или переработку добавляйте как доход.</div>' +
    '<div id="w-rate" style="' + (w.mode === 'rate' ? '' : 'display:none') + '"><label>Ставка, ' + SYM() + ' в час</label><input id="w-r" inputmode="decimal" value="' + (w.rate || '') + '" placeholder="Например, 450" autocomplete="off"></div>' +
    '<div id="w-range" style="' + (w.mode === 'range' ? '' : 'display:none') + '"><label>Сколько обычно получаете за месяц, ' + SYM() + '</label><div class="row2"><input id="w-min" inputmode="decimal" value="' + (w.min || '') + '" placeholder="от, например 65000" style="flex:1" autocomplete="off"><input id="w-max" inputmode="decimal" value="' + (w.max || '') + '" placeholder="до, например 97000" style="flex:1" autocomplete="off"></div>' +
    '<div class="hi" style="margin:.4rem .25rem 0;font-size:.8rem;font-weight:600">Часы нужны только для учёта: по ним прикинем цену вашего часа.</div></div>' +
 '<div id="w-bonus" style="' + (w.mode === 'fixed' ? 'display:none' : '') + '"><label>Доход месяца</label><div class="chips"><button class="chip ' + (w.auto !== false ? 'on' : '') + '" data-act="wauto" data-v="1">Считать по часам</button><button class="chip ' + (w.auto === false ? 'on' : '') + '" data-act="wauto" data-v="0">Как в настройках</button></div><label>Премия в месяц, ' + SYM() + ' (если бывает)</label><input id="w-b" inputmode="decimal" value="' + (w.bonus || '') + '" placeholder="Необязательно" autocomplete="off"></div>' +
    (S.work ? '<button class="btn ghost danger" data-act="workoff">Выключить учёт часов</button>' : '') +
    '<button class="btn big" data-act="worksave">Сохранить</button>');
}
var editShiftId = null;
function openShift(id){
  editShiftId = id || null;
  var ex = id ? S.work.shifts.filter(function(x){ return x.id === id; })[0] : null;
  var def = ex || (S.work && S.work.shifts.length ? S.work.shifts[S.work.shifts.length - 1] : null);
  sheet('<h3>' + (ex ? 'Изменить смену' : 'Смена') + '</h3><label>Дата</label><input id="s-date" type="date" value="' + (ex ? ex.date : today()) + '">' +
    '<label>Начало и конец</label><div class="row2"><input id="s-from" type="time" value="' + (def && def.from || '08:00') + '" style="flex:1"><input id="s-to" type="time" value="' + (def && def.to || '17:00') + '" style="flex:1"></div>' +
    '<label>Или сразу часы</label><input id="s-h" inputmode="decimal" placeholder="Например, 8,5" autocomplete="off"' + (ex && !(ex.from && ex.to) ? ' value="' + String(ex.h).replace('.', ',') + '"' : '') + '>' +
    (ex ? '<button class="btn ghost danger" data-act="delshift" data-id="' + ex.id + '">Удалить смену</button>' : '') +
    '<button class="btn big" data-act="saveshift">' + (ex ? 'Сохранить' : 'Записать') + '</button>');
}
function spentSheet(){
  var k = curKey(), tot = spentOf(k), rows = S.cats.map(function(c){ return {c: c, v: sum(catOps(k, c.id).map(function(o){ return o.amount; }))}; }).filter(function(r){ return r.v > 0; }).sort(function(a, b){ return b.v - a.v; });
  var other = sum(opsOf(k).filter(function(o){ return o.type === 'expense' && !catById(o.catId); }).map(function(o){ return o.amount; }));
  var h = '<h3>Потрачено · ' + MONTHS[VM.m] + '</h3>';
  if (!rows.length && !other) return sheet(h + '<div class="empty">В этом месяце трат пока нет</div>');
  h += rows.map(function(r){
    var pc = tot > 0 ? Math.max(2, Math.round(r.v / tot * 100)) : 0;
    return '<div class="brow">' + ci(r.c.emoji) + '<div class="bm"><b><span>' + esc(r.c.name) + '</span><span>' + fmt(r.v) + '</span></b><div class="bb"><i style="width:' + pc + '%"></i></div>' +
      (r.c.limit > 0 ? '<div class="hi" style="font-size:.78rem;font-weight:600;margin-top:.25rem">' + (r.v > r.c.limit ? 'Сверх лимита на ' + fmt(r.v - r.c.limit) : 'Лимит ' + fmt(r.c.limit) + ', осталось ' + fmt(r.c.limit - r.v)) + '</div>' : '') + '</div></div>';
  }).join('');
  if (other > 0) h += '<div class="brow">' + ci('•') + '<div class="bm"><b><span>Без категории</span><span>' + fmt(other) + '</span></b></div></div>';
  sheet(h + '<div class="btot"><span>Всего</span><span>' + fmt(tot) + '</span></div>');
}
function incomeSheet(){
  var k = curKey(), ex = opsOf(k).filter(function(o){ return o.type === 'income'; }).sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var h = '<h3>Доход · ' + MONTHS[VM.m] + '</h3><div class="brow"><div class="bm"><b><span>' + (workAuto(k) ? 'По часам: ' + fmtH(hoursOf(k)) : 'Основной доход') + '</span><span>' + fmt(workAuto(k) ? earnedOf(k) : baseIncome(k)) + '</span></b></div></div>';
  h += ex.map(function(o){ return '<div class="brow"><div class="bm"><b><span>' + esc(o.note || 'Доп. поступление') + '</span><span>+' + fmt(o.amount) + '</span></b><div class="hi" style="font-size:.78rem;font-weight:600">' + o.date.slice(8,10) + '.' + o.date.slice(5,7) + '</div></div></div>'; }).join('');
  if (S.work && scope === 'me') { var c = workCalc(k); if (c && c.rate > 0) h += '<div class="hi" style="margin:.6rem .1rem 0;font-weight:600">По часам: отработано ' + fmtH(c.worked) + ', это ≈ ' + fmt(Math.round(c.earned)) + ' по оценке ставки. ' + (workAuto(k) ? 'Доход месяца считается по часам.' : 'В доход эта сумма не входит: основной доход задаётся в настройках.') + '</div>'; }
  sheet(h + '<div class="btot"><span>Всего</span><span>' + fmt(incomeOf(k)) + '</span></div>');
}
function exportCard(){
  return '<div class="card set"><label style="margin-top:0">Экспорт</label><button class="btn ghost" data-act="export">Выгрузить операции (CSV для Excel)</button></div>';
}
function csvText(){
  var q = function(v){ v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['Дата','Тип','Категория','Сумма','Комментарий','Кто']];
  S.ops.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.t - b.t; }).forEach(function(o){
    var c = catById(o.catId);
    rows.push([o.date, o.type === 'income' ? 'Доход' : 'Расход', c ? c.name : '', o.amount, o.note || '', scope === 'fam' && o.by ? memberName(o.by) : '']);
  });
  return rows.map(function(r){ return r.map(q).join(';'); }).join('\n');
}
function openOnboard(){
  var inc = S.defaultIncome || '';
  sheet('<h3>Давайте настроим Копилку</h3>' +
    '<div class="hi" style="margin:.2rem 0 .4rem;font-weight:600">Три вопроса, и приложение посчитает, сколько откладывать.</div>' +
    '<label>1. Ваш доход в месяц, '+SYM()+'</label><input id="o-inc" inputmode="decimal" value="'+inc+'" placeholder="Например, 90000" autocomplete="off">' +
    '<label>2. На что копите?</label><input id="o-goal" placeholder="Например, Отпуск" autocomplete="off">' +
    '<div class="row2" style="margin-top:.5rem"><input id="o-target" inputmode="decimal" placeholder="Сумма цели, '+SYM()+'" style="flex:1" autocomplete="off"><input id="o-months" inputmode="numeric" placeholder="За сколько мес." style="flex:1" autocomplete="off"></div>' +
    '<button class="btn ghost" style="margin-top:.8rem" data-act="onboardskip">Пропустить</button>' +
    '<button class="btn big" data-act="onboarddone">Готово</button>');
}
function maybeOnboard(){
  if (scope === 'me' && S && !S.onboarded && S.ops.length === 0) setTimeout(function(){ if (!$('#sheet').classList.contains('on')) openOnboard(); }, 400);
}
function copyText(t){
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function(){ toast('Скопировано'); }, function(){ fallbackCopy(t); }); return; } } catch(e){}
  fallbackCopy(t);
}
function fallbackCopy(t){
  var ta = $('#csv-text');
  if (ta) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Скопировано'); return; } catch(e){} }
  toast('Выделите текст и скопируйте вручную');
}

function loadExtras(){
  if (!ONLINE) return;
  loadFamInfo().then(function(){ if (TAB === 'prof' || TAB === 'set' || TAB === 'home') render(); }).catch(function(){});
  api('GET', '/api/prefs').then(function(r){ PREFS = {remind: !!r.remind, weekly: !!r.weekly, bills: !!r.bills, monthly: !!r.monthly, hour: r.hour || 20}; if (TAB === 'set') render(); }).catch(function(){});
  (function getPlan(n){
    api('GET', '/api/plan').then(function(r){
      PLAN = r; try { localStorage.setItem('kp_own', r && r.owner ? '1' : ''); } catch (e) {}
      if (TAB === 'prof' || TAB === 'set' || TAB === 'home') render(); maybeThanks();
    }).catch(function(){ if (n < 3) setTimeout(function(){ getPlan(n + 1); }, 3000 * (n + 1)); });
  })(0);
  api('GET', '/api/rates').then(function(r){ if (r && r.rates) { RATES = r.rates; if ($('#f-fx')) updFx(); } }).catch(function(){});
  api('GET', '/api/ref').then(function(r){ REF = r; if (TAB === 'prof') render(); }).catch(function(){});
}
function boot(){
  applyTheme();
  if (!ONLINE) { applyRecurring(); render(); maybeOnboard(); return; }
  $('#nav').style.display = 'none'; $('#fab').style.display = 'none';
  $('#app').innerHTML = '<div class="empty" style="padding-top:38vh;font-size:1.125rem">Загрузка…</div>';
  api('GET', '/api/state').then(function(r){
    if (typeof r.rev !== 'number') { var nb = new Error('no backend'); nb.status = 404; throw nb; }
    BOT = r.bot || '';
    if (r.state) { setState('me', normalize(r.state)); slots.me.rev = r.rev; cacheLocal('me'); }
    else {
      setState('me', normalize(S));   // новый пользователь: отправляем начальные данные на сервер
      S.goals.forEach(function(g){ if (g.img) api('PUT', '/api/img/' + g.id, {img: g.img}).catch(function(){}); });
      save();
    }
    syncState = 'ok';
  }).catch(function(e){
    if (e.status === 404 || e.status === 405) {   // сервера нет (например, GitHub Pages): храним данные на телефоне
      ONLINE = false; syncState = 'local'; setState('me', normalize(S)); return;
    }
    if (e.status === 401) {
      blocked = true;
      $('#app').innerHTML = '<div class="card empty">Не удалось войти. Закройте приложение и откройте его заново через бота в Telegram.</div>';
      return;
    }
    setState('me', normalize(S)); syncState = 'offline'; toast('Нет связи с сервером. Работаю офлайн');
  }).then(function(){
    if (blocked) return;
    applyRecurring();
    $('#nav').style.display = ''; render();
    loadExtras(); maybeOnboard();
  });
}

function pull(sc){
  var sl = slots[sc];
  if (!sl.s || sl.inflight || sl.pending || sl.dirty) return;
  (sc === 'fam' ? loadFamInfo().catch(function(){}) : Promise.resolve()).then(function(){ return api('GET', '/api/state' + qs(sc)); }).then(function(r){
    if (r.state && r.rev > sl.rev && !sl.dirty && !sl.inflight) {
      setState(sc, normalize(r.state)); sl.rev = r.rev; syncState = 'ok'; cacheLocal(sc);
      if (!$('#sheet').classList.contains('on')) render();
    }
  }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if (!ONLINE || blocked) return;
  if (document.hidden) { ['me', 'fam'].forEach(function(sc){ if (slots[sc].dirty) { clearTimeout(slots[sc].pushT); push(sc); } }); return; }
  pull('me'); if (FAM && FAM.family && slots.fam.s) pull('fam');
});
setInterval(function(){ if (ONLINE && !blocked && !document.hidden && scope === 'fam') pull('fam'); }, 20000);

boot();
})();
</script>
