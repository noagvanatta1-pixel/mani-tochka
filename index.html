<script>
/* Скрипт Telegram подключаем только внутри Telegram. Вне его (Android-приложение, сайт) telegram.org может не открываться
   или «зависать», и тогда блокирующий <script> оставлял чёрный экран. */
(function(){
  var inTg = /tgWebApp/.test(location.hash || '') || !!window.TelegramWebviewProxy;
  try { inTg = inTg || !!sessionStorage.getItem('__telegram__initParams'); } catch (e) {}
  if (inTg) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
})();
</script>

/* переключатели: зелёный — включено, красный — выключено, белый шарик скользит */
.tog button.sw{position:relative;flex:none;width:3.5rem;height:2rem;padding:0;border-radius:1rem;background:var(--red,#e5484d);color:transparent;font-size:0;transition:background-color .22s ease}
.tog button.sw:after{content:"";position:absolute;top:.25rem;left:.25rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .22s ease}
.tog button.sw.on{background:var(--green,#2fc596)}
.tog button.sw.on:after{transform:translateX(1.5rem)}
/* иерархия кнопок: главная — яркая с градиентом, второстепенные — с контуром, «добавить» — зелёные, «навсегда» — золотая */
#app .btn:not(.ghost):not(.danger){background:linear-gradient(135deg,var(--bal1),var(--bal2));color:#fff;box-shadow:0 .4rem 1.1rem rgba(var(--sh),.35),0 0 .9rem rgba(124,140,255,.35)}
#app .btn.ghost:not(.danger){background:transparent;color:var(--pink-d);box-shadow:none;border:1.5px solid var(--pink)}
#app .btn.ghost[data-act=newgoal],#app .btn.ghost[data-act=newdebt],#app .btn.ghost[data-act=newrec],#app .btn.ghost[data-act=newshift],#app .btn.ghost[data-act=newcat],#app .btn.ghost[data-act=invite]{background:rgba(47,197,150,.13);color:var(--green,#0f9d74);border-color:var(--green,#0f9d74)}
#app .btn.ghost[data-act=pay][data-v=life]{background:rgba(255,194,77,.14);color:#d99200;border-color:#ffc24d}
.plan.slim{background:var(--pink-l);color:var(--ink);box-shadow:none}
.plan.slim>:first-child{flex:none;width:2.3rem!important;height:2.3rem!important;box-sizing:border-box;padding:.5rem;border-radius:.75rem;background:var(--btn);color:#fff}
.plan.slim[data-act=stats]>:first-child{background:var(--green,#0f9d74)}
.plan.slim[data-act=plan]>:first-child{background:#e69a00}
.plan.slim span{color:var(--muted)}
.chip[data-act=refuse]{background:var(--btn);color:#fff;font-weight:800}
.tog:has(a[data-act=legal]){gap:.6rem}
.tog a[data-act=legal]{flex:1;background:transparent;color:var(--pink-d)!important;border:1.5px solid var(--pink);padding:.5rem .9rem;border-radius:.8rem;font-size:.9rem;text-align:center}
/* быстрые категории: неоновые значки, как в сетке категорий */
.chip[style*="--ch"]{border:1px solid hsl(var(--ch) 70% 60%/.32)}
.chip[style*="--ch"] .ci{color:hsl(var(--ch) 80% 72%);background:hsl(var(--ch) 75% 55%/.28);border-radius:.5rem;box-shadow:0 0 10px hsl(var(--ch) 85% 60%/.35)}
.chip.on[style*="--ch"] .ci{color:#fff;background:transparent;box-shadow:none}

/* карточка ввода суммы */
.amtcard{margin:.7rem 0 .5rem;border-radius:1.5rem;padding:1rem 1.1rem 1.1rem;background:linear-gradient(135deg,var(--bal1),var(--bal2));color:#fff;position:relative;overflow:hidden;box-shadow:0 .6rem 1.4rem rgba(var(--sh),.25)}
.amtcard:before{content:"";position:absolute;right:-3rem;top:-3.5rem;width:11rem;height:11rem;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.amtcard .ac-top{display:flex;align-items:center;gap:.65rem;position:relative}
.amtcard .ac-ico{width:2.5rem;height:2.5rem;border-radius:.9rem;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.amtcard .ac-lbl{flex:1;font-size:1rem;font-weight:600;opacity:.92}
.amtcard .ac-cur{font-size:.9rem;font-weight:800;padding:.35rem .8rem;border-radius:2rem;background:rgba(255,255,255,.22)}
.panel .amtcard .amtbox{justify-content:flex-start;margin:.7rem 0 0;position:relative}
.panel .amtcard .amtbox input{color:#fff;text-align:left;font-size:clamp(30px,11vw,3rem);font-weight:800;padding:0;letter-spacing:-.02em;caret-color:#fff}
.panel .amtcard .amtbox input::placeholder{color:rgba(255,255,255,.45)}
/* быстрые кнопки */
.qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:0 0 .9rem}
.qrow button{display:flex;flex-direction:column;align-items:center;gap:.4rem;font-size:.75rem;font-weight:700;color:var(--ink)}
.qrow .qi{width:3.6rem;height:3.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--pink-d);box-shadow:inset 0 0 0 1px var(--line),0 .25rem .8rem rgba(var(--sh),.1)}
.qrow button:active .qi{transform:scale(.94)}

/* долги */
.dtop{margin:0 0 .7rem}.stile.ok.on{background:linear-gradient(135deg,#0f9d73,#0a6e52)}
.dsub{margin:0 0 .8rem}.dsub button{font-size:.85rem}
.dseg button{white-space:nowrap;font-size:.9rem;padding-left:.3rem;padding-right:.3rem}
.dseg button i{font-style:normal;font-size:.7rem;font-weight:800;margin-left:.25rem;padding:.05rem .4rem;border-radius:1rem;background:rgba(127,127,160,.25)}
.debt .pav{width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 1.2rem var(--fd,inherit);flex:none}
.debt .amt.in{color:var(--green)}
.dtag{display:inline-block;margin:-.3rem 0 .5rem .25rem;padding:.2rem .65rem;border-radius:1rem;font-size:.75rem;font-weight:800}

.dremind{display:block;margin:.1rem auto 0;padding:.5rem;font-size:.85rem;font-weight:700;color:var(--muted)}
.dbtns{display:flex;gap:.5rem}.dbtns .btn{flex:1}
.dempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem;padding:1.6rem 1.2rem}

.dempty b{font-size:1.05rem;color:var(--ink)}.dempty p{margin:0;font-size:.875rem;color:var(--muted);font-weight:600}

/* выбор личный / семейный */
.scopecard{margin:0 0 .9rem}
.scopecard .sch{font-size:.85rem;font-weight:700;color:var(--muted);margin:0 .4rem .5rem}
.stiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;padding:.9rem 1rem;border-radius:1.25rem;background:var(--card);color:var(--ink);text-align:left;box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
.stile .si{width:2.6rem;height:2.6rem;border-radius:.9rem;display:flex;align-items:center;justify-content:center;background:var(--pink-l);color:var(--pink-d);margin-bottom:.4rem}
.stile b{font-size:1.1rem;font-weight:800}
.stile em{font-style:normal;font-size:.78rem;font-weight:600;color:var(--muted)}
.stile.on{background:linear-gradient(135deg,var(--bal1),var(--bal2));color:#fff;box-shadow:0 .5rem 1.2rem rgba(var(--sh),.3)}
.stile.on .si{background:rgba(255,255,255,.22);color:#fff}
.stile.on em{color:rgba(255,255,255,.8)}

/* плитки на главной */
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.75rem 0 .25rem}
.ht{display:flex;align-items:center;flex-wrap:wrap;gap:.1rem .6rem;padding:.8rem .9rem;border-radius:1.1rem;background:var(--pink-l);color:var(--ink);text-align:left}
.ht .hi2{width:2.3rem;height:2.3rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ht b{font-size:1rem;font-weight:800;flex:1;min-width:0}
.ht em{flex-basis:100%;font-style:normal;font-size:.75rem;font-weight:600;color:var(--muted);margin-top:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legal{display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap;margin:.7rem 0 .2rem}.legal a{font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:.15rem;cursor:pointer}


.curtain{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));overflow:hidden;pointer-events:none}
@keyframes curIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes curOut{from{transform:none}to{transform:translateX(-100%)}}
.curtain.cin{animation:curIn .3s cubic-bezier(.22,.8,.25,1) both}
.curtain.cout{animation:curOut .26s cubic-bezier(.4,0,.8,.4) both}
.plan.slim.acc span{transition:transform .2s}.plan.slim.acc.open span{transform:rotate(90deg)}
.plan.slim[data-act=themetoggle]>:first-child{background:#9b59d6!important}

.debt.loan:before{content:"";position:absolute;left:0;top:0;bottom:0;width:.28rem;background:linear-gradient(180deg,hsl(var(--dh),70%,58%),hsl(calc(var(--dh) + 40),70%,45%))}

function calcPlan(rest, months, inc){

function plan(g){

    if (rest <= 0) return {done: true};

var DKINDS = {loan: 'Кредит или рассрочка', owe: 'Я должен человеку', owed: 'Мне должны'}, dKind = 'loan', dId = null, dpId = null;
function payoffInfo(d){
  var left = debtLeft(d); if (left <= 0) return {done: true};
  if (!(d.pay > 0)) return {};
  var r = (d.rate || 0) / 12 / 100, n;
  if (r > 0) { if (d.pay <= left * r) return {never: true}; n = Math.ceil(-Math.log(1 - r * left / d.pay) / Math.log(1 + r)); }
  else n = Math.ceil(left / d.pay);
  var dt = new Date(); dt.setMonth(dt.getMonth() + n);
  return {months: n, date: MONTHS[dt.getMonth()].toLowerCase() + ' ' + dt.getFullYear()};
}
function nextPayText(d){
  if (!(d.pay > 0) || debtLeft(d) <= 0 || d.kind === 'owed') return '';
  var n = new Date(), y = n.getFullYear(), m = n.getMonth(), day = d.day || 1;

  var dd = Math.min(day, new Date(y, m + 1, 0).getDate());
  if (paid || dd < n.getDate()) { m++; if (m > 11) { m = 0; y++; } dd = Math.min(day, new Date(y, m + 1, 0).getDate()); }
  return pad(dd) + '.' + pad(m + 1);

  if (prev.length) return {v: rnd(sum(prev) / prev.length), src: 'по вашим тратам за прошлые месяцы'};
  if (cur > 0) return {v: rnd(cur), src: 'по тратам этого месяца'};
  var plan = sum(S.cats.map(function(c){ return c.limit > 0 ? c.limit : 0; })) + sum((S.recurring || []).map(function(r){ return r.amount || 0; })) + sum((S.debts || []).filter(function(x){ return x.kind !== 'owed' && debtLeft(x) > 0; }).map(function(x){ return x.pay || 0; }));

function updGoal(){
  var el = $('#g-prev'); if (!el) return;
  var tg_ = num($('#g-target').value), mo = Math.round(num($('#g-months').value)), g = editId ? goalById(editId) : null;
  var rest = tg_ - (g ? saved(g) : 0), inc = baseIncome(realKey());
  el.classList.remove('neg');
  if (tg_ <= 0 || mo <= 0) { el.textContent = 'Введите сумму и срок — посчитаю, сколько откладывать в месяц при зарплате ' + fmt(inc) + '.'; return; }
  if (rest <= 0) { el.textContent = 'Эта сумма уже накоплена 🎉'; return; }
  var r = calcPlan(rest, mo, inc);
  if (r.over) {
    var need = Math.ceil(rest / (inc * 0.3));
    el.classList.add('neg');
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес — это больше зарплаты (' + fmt(inc) + '). Реалистичнее копить около ' + need + ' ' + plural(need, ['месяц','месяца','месяцев']) + ' (30% зарплаты).';
  } else {
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес (' + Math.round(r.per / inc * 100) + '% зарплаты). На жизнь останется ≈ ' + fmt(r.free) + '/мес при зарплате ' + fmt(inc) + '.';
  }
}

function convertAll(k){
  var r = function(x){ return Math.round((+x || 0) * k * 100) / 100; };
  (S.ops || []).forEach(function(o){ o.amount = r(o.amount); });
  S.defaultIncome = r(S.defaultIncome);
  Object.keys(S.income || {}).forEach(function(m){ S.income[m] = r(S.income[m]); });
  (S.cats || []).forEach(function(c){ c.limit = r(c.limit); });
  (S.goals || []).forEach(function(g){ g.target = r(g.target); (g.contribs || []).forEach(function(c){ c.amount = r(c.amount); }); });
  (S.recurring || []).forEach(function(x){ x.amount = r(x.amount); });
  (S.debts || []).forEach(function(d){ d.total = r(d.total); d.pay = r(d.pay); (d.payments || []).forEach(function(p){ p.amount = r(p.amount); }); });
}

function applyRecurring(){
  if (!S || !S.recurring || !S.recurring.length) return;
  var n = new Date(), cur = mk(n.getFullYear(), n.getMonth()), added = false, have = {};
  S.ops.forEach(function(o){ if (o.rid) have[o.rid] = 1; });
  S.recurring.forEach(function(r){
    var y, m;
    if (r.done) { y = +r.done.slice(0,4); m = +r.done.slice(5,7); if (m > 11) { m = 0; y++; } }
    else { y = +r.from.slice(0,4); m = +r.from.slice(5,7) - 1; }
    for (var guard = 0; guard < 48; guard++) {
      var key = mk(y, m); if (key > cur) break;
      var day = Math.min(r.day, new Date(y, m + 1, 0).getDate()), date = key + '-' + pad(day), rid = r.id + '_' + key;
      if (key === cur && date > today()) break;
      if (!have[rid]) { S.ops.push({id: uid(), rid: rid, type: 'expense', amount: r.amount, catId: r.catId, note: r.name, date: date, t: Date.now(), by: 0, auto: 1}); have[rid] = 1; }
      r.done = key; added = true;
      m++; if (m > 11) { m = 0; y++; }
    }
  });
  if (added) save();
}

var WORK_NORM = 160, workMode = 'rate', workAuto0 = true;
function workDis(){ try { return localStorage.getItem('kp_wkdis') === '1'; } catch (e) { return false; } }
function workRate(w){
  if (w.mode === 'rate') return w.rate || 0;
  var mid = w.min && w.max ? (w.min + w.max) / 2 : (w.max || w.min || 0);

function hoursOf(k){ return sum(((S.work && S.work.shifts) || []).filter(function(x){ return x.date.slice(0,7) === k; }).map(function(x){ return x.h; })); }

function workCalc(k){
  var w = S.work; if (!w) return null;
  var rate = workRate(w); if (rate <= 0) return {rate: 0, worked: hoursOf(k)};
  var g = goalById(S.mainGoal), p = g ? plan(g) : null, goalPer = p && !p.done ? p.per : 0;

function workListCard(){
  if (!S.work) return '';

      '<div class="hi" style="margin:.4rem .25rem .6rem;font-size:.8rem;font-weight:600">Нажмите на смену, чтобы изменить или удалить</div>' : '<div class="hi" style="margin:0 .25rem .6rem;font-weight:600">Смен пока нет.</div>') +
    '<button class="btn ghost" data-act="newshift">' + ic('plus', 22) + ' Записать смену</button></div>';
}
function openWork(){
  var w = S.work || {mode: 'rate', rate: 0, min: 0, max: 0, bonus: 0};
  workMode = w.mode; workAuto0 = w.auto !== false;
  sheet('<h3>Рабочие часы</h3><label>Есть ли ставка?</label><div class="chips">' +
    '<button class="chip ' + (w.mode === 'rate' ? 'on' : '') + '" data-act="wmode" data-v="rate">Есть ставка за час</button>' +
    '<button class="chip ' + (w.mode === 'range' ? 'on' : '') + '" data-act="wmode" data-v="range">Нет ставки</button>' +
    '<button class="chip ' + (w.mode === 'fixed' ? 'on' : '') + '" data-act="wmode" data-v="fixed">Фиксированная зарплата</button></div>' +
    '<div id="w-fixed" class="hi" style="margin:.6rem .25rem 0;font-weight:600;' + (w.mode === 'fixed' ? '' : 'display:none') + '">Доход остаётся как в настройках, часы идут только для учёта. Премию или переработку добавляйте как доход.</div>' +
    '<div id="w-rate" style="' + (w.mode === 'rate' ? '' : 'display:none') + '"><label>Ставка, ' + SYM() + ' в час</label><input id="w-r" inputmode="decimal" value="' + (w.rate || '') + '" placeholder="Например, 450" autocomplete="off"></div>' +
    '<div id="w-range" style="' + (w.mode === 'range' ? '' : 'display:none') + '"><label>Сколько обычно получаете за месяц, ' + SYM() + '</label><div class="row2"><input id="w-min" inputmode="decimal" value="' + (w.min || '') + '" placeholder="от, например 65000" style="flex:1" autocomplete="off"><input id="w-max" inputmode="decimal" value="' + (w.max || '') + '" placeholder="до, например 97000" style="flex:1" autocomplete="off"></div>' +
    '<div class="hi" style="margin:.4rem .25rem 0;font-size:.8rem;font-weight:600">Часы нужны только для учёта: по ним прикинем цену вашего часа.</div></div>' +
 '<div id="w-bonus" style="' + (w.mode === 'fixed' ? 'display:none' : '') + '"><label>Доход месяца</label><div class="chips"><button class="chip ' + (w.auto !== false ? 'on' : '') + '" data-act="wauto" data-v="1">Считать по часам</button><button class="chip ' + (w.auto === false ? 'on' : '') + '" data-act="wauto" data-v="0">Как в настройках</button></div><label>Премия в месяц, ' + SYM() + ' (если бывает)</label><input id="w-b" inputmode="decimal" value="' + (w.bonus || '') + '" placeholder="Необязательно" autocomplete="off"></div>' +
    (S.work ? '<button class="btn ghost danger" data-act="workoff">Выключить учёт часов</button>' : '') +
    '<button class="btn big" data-act="worksave">Сохранить</button>');
}
var editShiftId = null;
function openShift(id){
  editShiftId = id || null;
  var ex = id ? S.work.shifts.filter(function(x){ return x.id === id; })[0] : null;
  var def = ex || (S.work && S.work.shifts.length ? S.work.shifts[S.work.shifts.length - 1] : null);
  sheet('<h3>' + (ex ? 'Изменить смену' : 'Смена') + '</h3><label>Дата</label><input id="s-date" type="date" value="' + (ex ? ex.date : today()) + '">' +
    '<label>Начало и конец</label><div class="row2"><input id="s-from" type="time" value="' + (def && def.from || '08:00') + '" style="flex:1"><input id="s-to" type="time" value="' + (def && def.to || '17:00') + '" style="flex:1"></div>' +
    '<label>Или сразу часы</label><input id="s-h" inputmode="decimal" placeholder="Например, 8,5" autocomplete="off"' + (ex && !(ex.from && ex.to) ? ' value="' + String(ex.h).replace('.', ',') + '"' : '') + '>' +
    (ex ? '<button class="btn ghost danger" data-act="delshift" data-id="' + ex.id + '">Удалить смену</button>' : '') +
    '<button class="btn big" data-act="saveshift">' + (ex ? 'Сохранить' : 'Записать') + '</button>');
}
function spentSheet(){
  var k = curKey(), tot = spentOf(k), rows = S.cats.map(function(c){ return {c: c, v: sum(catOps(k, c.id).map(function(o){ return o.amount; }))}; }).filter(function(r){ return r.v > 0; }).sort(function(a, b){ return b.v - a.v; });
  var other = sum(opsOf(k).filter(function(o){ return o.type === 'expense' && !catById(o.catId); }).map(function(o){ return o.amount; }));
  var h = '<h3>Потрачено · ' + MONTHS[VM.m] + '</h3>';
  if (!rows.length && !other) return sheet(h + '<div class="empty">В этом месяце трат пока нет</div>');
  h += rows.map(function(r){
    var pc = tot > 0 ? Math.max(2, Math.round(r.v / tot * 100)) : 0;
    var hue = (S.cats.indexOf(r.c) * 47 + 20) % 360;
    return '<div class="brow" style="--ch:' + hue + '">' + ci(r.c.emoji) + '<div class="bm"><b><span>' + esc(r.c.name) + '</span><span>' + fmt(r.v) + '</span></b><div class="bb"><i style="width:' + pc + '%"></i></div>' +
      (r.c.limit > 0 ? '<div class="hi" style="font-size:.78rem;font-weight:600;margin-top:.25rem">' + (r.v > r.c.limit ? 'Сверх лимита на ' + fmt(r.v - r.c.limit) : 'Лимит ' + fmt(r.c.limit) + ', осталось ' + fmt(r.c.limit - r.v)) + '</div>' : '') + '</div></div>';
  }).join('');
  if (other > 0) h += '<div class="brow">' + ci('•') + '<div class="bm"><b><span>Без категории</span><span>' + fmt(other) + '</span></b></div></div>';
  sheet(h + '<div class="btot"><span>Всего</span><span>' + fmt(tot) + '</span></div>');
}
function incomeSheet(){
  var k = curKey(), ex = opsOf(k).filter(function(o){ return o.type === 'income'; }).sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var h = '<h3>Доход · ' + MONTHS[VM.m] + '</h3><div class="brow"><div class="bm"><b><span>' + (workAuto(k) ? 'По часам: ' + fmtH(hoursOf(k)) : 'Основной доход') + '</span><span>' + fmt(workAuto(k) ? earnedOf(k) : baseIncome(k)) + '</span></b></div></div>';
  h += ex.map(function(o){ return '<div class="brow"><div class="bm"><b><span>' + esc(o.note || 'Доп. поступление') + '</span><span>+' + fmt(o.amount) + '</span></b><div class="hi" style="font-size:.78rem;font-weight:600">' + o.date.slice(8,10) + '.' + o.date.slice(5,7) + '</div></div></div>'; }).join('');
  if (S.work && scope === 'me') { var c = workCalc(k); if (c && c.rate > 0) h += '<div class="hi" style="margin:.6rem .1rem 0;font-weight:600">По часам: отработано ' + fmtH(c.worked) + ', это ≈ ' + fmt(Math.round(c.earned)) + ' по оценке ставки. ' + (workAuto(k) ? 'Доход месяца считается по часам.' : 'В доход эта сумма не входит: основной доход задаётся в настройках.') + '</div>'; }
  sheet(h + '<div class="btot"><span>Всего</span><span>' + fmt(incomeOf(k)) + '</span></div>');
}
function exportCard(){
  return '<div class="card set"><label style="margin-top:0">Экспорт</label><button class="btn ghost" data-act="export">Выгрузить операции (CSV для Excel)</button></div>';
}
function csvText(){
  var q = function(v){ v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['Дата','Тип','Категория','Сумма','Комментарий','Кто']];
  S.ops.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.t - b.t; }).forEach(function(o){
    var c = catById(o.catId);
    rows.push([o.date, o.type === 'income' ? 'Доход' : 'Расход', c ? c.name : '', o.amount, o.note || '', scope === 'fam' && o.by ? memberName(o.by) : '']);
  });
  return rows.map(function(r){ return r.map(q).join(';'); }).join('\n');
}
function openOnboard(){
  var inc = S.defaultIncome || '';
  sheet('<h3>Давайте настроим Копилку</h3>' +
    '<div class="hi" style="margin:.2rem 0 .4rem;font-weight:600">Три вопроса, и приложение посчитает, сколько откладывать.</div>' +
    '<label>1. Ваш доход в месяц, '+SYM()+'</label><input id="o-inc" inputmode="decimal" value="'+inc+'" placeholder="Например, 90000" autocomplete="off">' +
    '<label>2. На что копите?</label><input id="o-goal" placeholder="Например, Отпуск" autocomplete="off">' +
    '<div class="row2" style="margin-top:.5rem"><input id="o-target" inputmode="decimal" placeholder="Сумма цели, '+SYM()+'" style="flex:1" autocomplete="off"><input id="o-months" inputmode="numeric" placeholder="За сколько мес." style="flex:1" autocomplete="off"></div>' +
    '<button class="btn ghost" style="margin-top:.8rem" data-act="onboardskip">Пропустить</button>' +
    '<button class="btn big" data-act="onboarddone">Готово</button>');
}
function maybeOnboard(){
  if (scope === 'me' && S && !S.onboarded && S.ops.length === 0) setTimeout(function(){ if (!$('#sheet').classList.contains('on')) openOnboard(); }, 400);
}
function copyText(t){
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function(){ toast('Скопировано'); }, function(){ fallbackCopy(t); }); return; } } catch(e){}
  fallbackCopy(t);
}
function fallbackCopy(t){
  var ta = $('#csv-text');
  if (ta) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Скопировано'); return; } catch(e){} }
  toast('Выделите текст и скопируйте вручную');
}

function loadExtras(){
  if (!ONLINE) return;
  loadFamInfo().then(function(){ if (TAB === 'prof' || TAB === 'set' || TAB === 'home') render(); }).catch(function(){});
  api('GET', '/api/prefs').then(function(r){ PREFS = {remind: !!r.remind, weekly: !!r.weekly, bills: !!r.bills, monthly: !!r.monthly, goals: !!r.goals, limits: !!r.limits, debts: !!r.debts, hour: r.hour || 20}; if (TAB === 'set') render(); }).catch(function(){});
  (function getPlan(n){
    api('GET', '/api/plan').then(function(r){
      PLAN = r; try { localStorage.setItem('kp_own', r && r.owner ? '1' : ''); } catch (e) {}
      if (TAB === 'prof' || TAB === 'set' || TAB === 'home') render(); maybeThanks();
    }).catch(function(){ if (n < 3) setTimeout(function(){ getPlan(n + 1); }, 3000 * (n + 1)); });
  })(0);
  api('GET', '/api/rates').then(function(r){ if (r && r.rates) { RATES = r.rates; if ($('#f-fx')) updFx(); } }).catch(function(){});
  api('GET', '/api/ref').then(function(r){ REF = r; if (TAB === 'prof') render(); }).catch(function(){});
}
/* ---------- Вход через Telegram вне Telegram ---------- */
var LOGIN = null;
var GATE = false;   // вне Telegram без входа: пользоваться можно только после входа
var OPEN_OK = {weblogin: 1, emaillogin: 1, emailreg: 1, openbot: 1, opensettings: 1, dismissal: 1, legal: 1, support: 1};
function webForget(reload){
  try { localStorage.removeItem('kp_web'); } catch(e){}
  WS = null;
  if (reload) { toast('Нужно войти заново'); setTimeout(function(){ location.reload(); }, 900); } else location.reload();
}
function loginStop(){ if (LOGIN) { clearTimeout(LOGIN.t); LOGIN.dead = true; } LOGIN = null; }
var EAUTH = false;
function loginSheet(st){
  var L = st ? null : LOGIN;
  var note = st === 'denied' ? '<div class="hi" style="margin:.2rem .25rem .6rem">Вход отменён в Telegram.</div>' :
    st === 'expired' ? '<div class="hi" style="margin:.2rem .25rem .6rem">Время вышло. Нажмите «Войти через Telegram» ещё раз.</div>' : '';
  var tgPart = L ?
    '<a class="btn ghost" href="' + esc(L.link) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Войти через Telegram</a>' +
    '<div class="hi" style="margin:.5rem .25rem 0;font-size:.82rem;font-weight:600">В боте нажмите «Подтвердить вход» и вернитесь сюда: вход произойдёт сам.</div>' :
    '<button class="btn ghost" data-act="weblogin">Войти через Telegram</button>';
  sheet('<h3>Вход в Копилку</h3>' + note +
    (GATE ? '<div class="hi" style="margin:.2rem .25rem .8rem">Войдите, чтобы ваши данные сохранялись и не пропадали.</div>' : '') +
    '<label style="margin-top:0">Почта</label><input class="f" id="lg-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="name@example.com">' +
    '<label>Пароль (от 8 символов)</label><input class="f" id="lg-pass" type="password" autocomplete="current-password" placeholder="Пароль">' +
    '<button class="btn ghost" style="margin-top:.6rem" data-act="emailreg">Создать аккаунт</button>' +
    '<div class="hi" style="margin:.5rem .25rem 0;font-size:.82rem;font-weight:600">Забыли пароль? Напишите в поддержку: @Noagvanatta1</div>' +
    '<div class="hi" style="text-align:center;margin:.9rem 0 .6rem;font-weight:600">или</div>' + tgPart +
    '<button class="btn big" data-act="emaillogin">Войти</button>');
}
function emailAuth(kind){
  var em = $('#lg-email'), pw = $('#lg-pass'); if (!em || !pw || EAUTH) return;
  var email = em.value.trim(), password = pw.value;
  if (!email || !password) { toast('Введите почту и пароль'); return; }
  EAUTH = true;
  fetch('/api/web/auth/' + kind, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: email, password: password})})
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw Object.assign(new Error(j.error || ''), {srv: true}); return j; }); })
    .then(function(r){
      try { localStorage.setItem('kp_web', JSON.stringify({token: r.token, id: r.user.id, name: r.user.first_name || ''})); } catch(e){}
      loginStop(); toast('Вход выполнен'); setTimeout(function(){ location.reload(); }, 500);
    }).catch(function(e){ EAUTH = false; toast(e && e.srv && e.message ? e.message : 'Не удалось войти. Проверьте связь и попробуйте позже'); });
}
function loginPoll(){
  var L = LOGIN; if (!L || L.dead) return;
  fetch('/api/web/login/poll', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: L.id, secret: L.secret})})
    .then(function(r){ return r.json(); }).then(function(r){
      if (!LOGIN || LOGIN !== L) return;
      if (r.status === 'ok' && r.token && r.user) {
        try { localStorage.setItem('kp_web', JSON.stringify({token: r.token, id: r.user.id, name: r.user.first_name || ''})); } catch(e){}
        loginStop(); toast('Вход выполнен'); setTimeout(function(){ location.reload(); }, 500); return;
      }
      if (r.status === 'denied' || r.status === 'expired') { loginSheet(r.status); loginStop(); return; }
      L.t = setTimeout(loginPoll, 2000);
    }).catch(function(){ if (LOGIN === L) L.t = setTimeout(loginPoll, 3000); });
}
function loginStart(){
  if (LOGIN && !LOGIN.dead) { loginSheet(); return; }
  loginStop();
  fetch('/api/web/login/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'})
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || 'err'); return j; }); })
    .then(function(r){
      LOGIN = {id: r.id, secret: r.secret, link: r.link, dead: false, t: 0};
      loginSheet(); loginPoll();
    }).catch(function(){ LOGIN = null; loginSheet(); });
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden && LOGIN) { clearTimeout(LOGIN.t); loginPoll(); } });
function boot(){
  applyTheme();
  if (!ONLINE) {
    applyRecurring(); render();
    if (IN_TG) { maybeOnboard(); return; }
    /* вне Telegram: если сервер умеет вход через бота, сразу предлагаем войти (окно можно закрыть) */
    fetch('/api/web/login/available').then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok) { GATE = true; render(); loginStart(); } else maybeOnboard();
    }).catch(function(){ maybeOnboard(); });
    return;
  }
  $('#nav').style.display = 'none'; $('#fab').style.display = 'none';
  $('#app').innerHTML = '<div class="empty" style="padding-top:38vh;font-size:1.125rem">Загрузка…</div>';
  api('GET', '/api/state').then(function(r){
    if (typeof r.rev !== 'number') { var nb = new Error('no backend'); nb.status = 404; throw nb; }
    BOT = r.bot || '';
    if (r.state) { setState('me', normalize(r.state)); slots.me.rev = r.rev; cacheLocal('me'); }
    else {
      setState('me', normalize(S));   // новый пользователь: отправляем начальные данные на сервер
      S.goals.forEach(function(g){ if (g.img) api('PUT', '/api/img/' + g.id, {img: g.img}).catch(function(){}); });
      save();
    }
    syncState = 'ok';
  }).catch(function(e){
    if (e.status === 404 || e.status === 405) {   // сервера нет (например, GitHub Pages): храним данные на телефоне
      ONLINE = false; syncState = 'local'; setState('me', normalize(S)); return;
    }
    if (e.status === 401) {
      blocked = true;
      $('#app').innerHTML = '<div class="card empty">Не удалось войти. Закройте приложение и откройте его заново через бота в Telegram.</div>';
      return;
    }
    setState('me', normalize(S)); syncState = 'offline'; toast('Нет связи с сервером. Работаю офлайн');
  }).then(function(){
    if (blocked) return;
    var want = ''; try { want = localStorage.getItem(KEY + '_scope') || ''; } catch (e) {}
    if (ONLINE && want === 'fam') {
      return loadFamInfo().then(function(){
        if (!FAM || !FAM.family) { saveScope(); return; }
        return (slots.fam.s ? Promise.resolve() : loadFam()).then(function(){ slots.me.s = S; scope = 'fam'; S = slots.fam.s; });
      }).catch(function(){});
    }
  }).then(function(){
    if (blocked) return;
    applyRecurring();
    $('#nav').style.display = ''; render();
    loadExtras(); maybeOnboard();
  });
}

function pull(sc){
  var sl = slots[sc];
  if (!sl.s || sl.inflight || sl.pending || sl.dirty) return;
  (sc === 'fam' ? loadFamInfo().catch(function(){}) : Promise.resolve()).then(function(){ return api('GET', '/api/state' + qs(sc)); }).then(function(r){
    if (r.state && r.rev > sl.rev && !sl.dirty && !sl.inflight) {
      setState(sc, normalize(r.state)); sl.rev = r.rev; syncState = 'ok'; cacheLocal(sc);
      if (!$('#sheet').classList.contains('on')) render();
    }
  }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if (!ONLINE || blocked) return;
  if (document.hidden) { ['me', 'fam'].forEach(function(sc){ if (slots[sc].dirty) { clearTimeout(slots[sc].pushT); push(sc); } }); return; }
  pull('me'); if (FAM && FAM.family && slots.fam.s) pull('fam');
});
setInterval(function(){ if (ONLINE && !blocked && !document.hidden && scope === 'fam') pull('fam'); }, 20000);

boot();
})();
</script>
