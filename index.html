/* ---------- Синхронизация с сервером ---------- */
var rev = 0, inflight = false, pending = false, dirty = false, blocked = false, pushT = null, retryT = null, BOT = '';
var syncState = ONLINE ? 'wait' : 'local';

function wire(){ return JSON.parse(JSON.stringify(S, function(k, v){ return k === 'img' ? undefined : v; })); }   // фото уходят отдельно
function cacheLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(ONLINE ? wire() : S)); }
  catch(e){ toast('Не удалось сохранить на устройстве: не хватает места'); }
}
function api(method, path, body){
  var opt = {method: method, headers: {'Authorization': 'tma ' + (tg ? tg.initData : ''), 'Content-Type': 'application/json'}};
  if (body != null) opt.body = JSON.stringify(body);
  return fetch(path, opt).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) { var e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; e.data = j; throw e; }
      return j;
    });
  });
}
function normalize(s){
  var d = defaults();
  if (!s || typeof s !== 'object') return d;
  ['cats','goals','ops'].forEach(function(k){ if (!Array.isArray(s[k])) s[k] = d[k]; });
  if (!s.income || typeof s.income !== 'object') s.income = {};
  if (typeof s.defaultIncome !== 'number') s.defaultIncome = d.defaultIncome;
  if (typeof s.name !== 'string') s.name = '';
  if (!THEMES[s.theme]) s.theme = 'pink';
  if (!SCALES[s.scale]) s.scale = 'm';
  s.goals.forEach(function(g){ if (!Array.isArray(g.contribs)) g.contribs = []; if (g.img == null) g.img = ''; });
  if (!s.goals.some(function(g){ return g.id === s.mainGoal; })) s.mainGoal = s.goals[0] ? s.goals[0].id : '';
  return s;
}
function save(){
  cacheLocal();
  if (ONLINE && !blocked) { dirty = true; clearTimeout(pushT); pushT = setTimeout(push, 500); }
}
function push(){
  if (!ONLINE || blocked) return;
  if (inflight) { pending = true; return; }
  inflight = true; pending = false; dirty = false;
  api('PUT', '/api/state', {state: wire(), rev: rev}).then(function(r){
    rev = r.rev; syncState = 'ok';
  }).catch(function(e){
    if (e.status === 409 && e.data && e.data.state) {
      S = normalize(e.data.state); rev = e.data.rev; syncState = 'ok'; cacheLocal(); render();
      toast('Данные обновлены с другого устройства');
    } else if (e.status === 401) {
      syncState = 'offline'; toast('Сессия истекла. Откройте приложение заново');
    } else {
      syncState = 'offline'; dirty = true;
      clearTimeout(retryT); retryT = setTimeout(push, 6000);
    }
  }).then(function(){ inflight = false; if (pending) push(); });
}

var now0 = new Date();
var VM = {y: now0.getFullYear(), m: now0.getMonth()};
var TAB = 'home';

var mk = function(y,m){ return y + '-' + pad(m+1); };
var curKey = function(){ return mk(VM.y, VM.m); };
function today(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isCur(){ var n = new Date(); return n.getFullYear() === VM.y && n.getMonth() === VM.m; }
function isPast(){ var n = new Date(); return new Date(VM.y, VM.m, 1) < new Date(n.getFullYear(), n.getMonth(), 1); }
function dim(){ return new Date(VM.y, VM.m+1, 0).getDate(); }
function daysLeft(){ if (!isCur()) return null; return dim() - new Date().getDate() + 1; }

var opsOf = function(k){ return S.ops.filter(function(o){ return o.date.slice(0,7) === k; }); };
var sum = function(arr){ return arr.reduce(function(a,x){ return a + x; }, 0); };
var spentOf = function(k){ return sum(opsOf(k).filter(function(o){ return o.type === 'expense'; }).map(function(o){ return o.amount; })); };
var extraOf = function(k){ return sum(opsOf(k).filter(function(o){ return o.type === 'income'; }).map(function(o){ return o.amount; })); };
var baseIncome = function(k){ return S.income[k] != null ? S.income[k] : S.defaultIncome; };
var incomeOf = function(k){ return baseIncome(k) + extraOf(k); };
var saved = function(g){ return sum(g.contribs.map(function(c){ return c.amount; })); };
var contribOf = function(k){ return sum(S.goals.map(function(g){ return sum(g.contribs.filter(function(c){ return c.date.slice(0,7) === k; }).map(function(c){ return c.amount; })); })); };
var leftOf = function(k){ return incomeOf(k) - spentOf(k) - contribOf(k); };
var catOps = function(k,id){ return opsOf(k).filter(function(o){ return o.type === 'expense' && o.catId === id; }); };
var catById = function(id){ return S.cats.filter(function(c){ return c.id === id; })[0]; };
var goalById = function(id){ return S.goals.filter(function(g){ return g.id === id; })[0]; };
var userName = function(){ return S.name || tgName || ''; };

/* ---------- Views ---------- */
function monthHeader(withHi){
  return '<div class="top"><div>' + (withHi ? '<div class="hi">Привет' + (userName() ? ', ' + esc(userName()) : '') + '</div>' : '<div class="hi">Месяц</div>') +
    '<div class="title">' + MONTHS[VM.m] + ' ' + VM.y + '</div></div>' +
    '<div class="mnav"><button data-act="mprev" aria-label="Предыдущий месяц">‹</button><button data-act="mnext" aria-label="Следующий месяц">›</button></div></div>';
}

function realKey(){ var n = new Date(); return mk(n.getFullYear(), n.getMonth()); }
function monthsSince(iso){
  var p = String(iso || today()).split('-'), n = new Date();
  return (n.getFullYear() - +p[0]) * 12 + (n.getMonth() - (+p[1] - 1));
}
function calcPlan(rest, months, inc){
  var per = Math.ceil(rest / months / 100) * 100;
  return {per: per, free: inc - per, inc: inc, over: per > inc};
}
function plan(g){
  if (!g.months) return null;
  var rest = g.target - saved(g);
  if (rest <= 0) return {done: true};
  var left = Math.max(1, g.months - monthsSince(g.start));
  var r = calcPlan(rest, left, baseIncome(realKey()));
  r.left = left; return r;
}
function planLine(g){
  var p = plan(g);
  if (!p) return '<div class="gplan hint" data-act="editgoal" data-id="'+g.id+'">Укажите срок — подскажу, сколько откладывать в месяц</div>';
  if (p.done) return '<div class="gplan"><b>Цель достигнута 🎉</b></div>';
  return '<div class="gplan '+(p.over ? 'neg' : '')+'" data-act="editgoal" data-id="'+g.id+'">Откладывать ≈ <b>'+fmt(p.per)+'</b>/мес · ещё '+p.left+' '+plural(p.left, ['месяц','месяца','месяцев']) +
    '<small>'+(p.over ? 'Больше зарплаты ('+fmt(p.inc)+') — увеличьте срок' : 'На жизнь останется ≈ '+fmt(p.free)+'/мес при зарплате '+fmt(p.inc))+'</small></div>';
}
function goalsSummary(){
  var tot = 0, n = 0, inc = baseIncome(realKey());
  S.goals.forEach(function(g){ var p = plan(g); if (p && !p.done) { tot += p.per; n++; } });
  if (!n) return '';
  var free = inc - tot;
  return '<div class="card"><div class="hi">Чтобы успеть по всем целям</div><div class="gsum" style="margin:0.375rem 0 0"><b>'+fmt(tot)+'</b> в месяц</div>' +
    '<div class="ok '+(free < 0 ? 'neg' : '')+'" style="font-size:1.0625rem;margin-top:0.375rem">'+(free < 0 ? 'Это больше зарплаты ('+fmt(inc)+')' : 'На жизнь останется ≈ '+fmt(free)+' из '+fmt(inc))+'</div></div>';
}

function goalCard(g, manage){
  var s = saved(g), p = pct(s, g.target), isMain = S.mainGoal === g.id;
  var img = g.img ? '<img src="'+g.img+'" alt="">' : '<div class="ph">🎯</div>';
  var tools = manage ? ((!isMain ? '<button class="ib star" data-act="maingoal" data-id="'+g.id+'" aria-label="Сделать основной">'+ic('star',22)+'</button>' : '') +
    '<button class="ib del" data-act="delgoal" data-id="'+g.id+'" aria-label="Удалить">'+ic('trash',22)+'</button>' +
    '<button class="ib cam" data-act="photo" data-id="'+g.id+'" aria-label="Фото">'+ic('camera',22)+'</button>') : '';
  return '<div class="card"><div class="gimg">'+img+(isMain ? '<span class="badge">Основная</span>' : '')+tools+'</div>' +
    '<div class="grow"><div class="gname" data-act="editgoal" data-id="'+g.id+'">'+esc(g.name)+'</div><span class="pill">'+p+'%</span></div>' +
    '<div class="gsum"><b>'+fmt(s)+'</b> из '+fmt(g.target)+'</div>' + planLine(g) +
    '<div class="bar"><i style="width:'+p+'%"></i></div>' +
    '<button class="btn" data-act="contrib" data-id="'+g.id+'">'+ic('plus',22)+' Добавить</button></div>';
}

function catCard(c, k){
  var list = catOps(k, c.id), sp = sum(list.map(function(o){ return o.amount; }));
  var left = c.limit - sp, over = sp > c.limit;
  var w = c.limit > 0 ? Math.min(100, sp / c.limit * 100) : (sp > 0 ? 100 : 0);
  var dl = daysLeft();
  return '<div class="card cat"><div class="h"><div class="em">'+esc(c.emoji)+'</div><div class="nm">'+esc(c.name)+'</div>' +
    '<button class="edit" data-act="editcat" data-id="'+c.id+'" aria-label="Изменить">'+ic('pencil',22)+'</button></div>' +
    '<div class="amt">'+fmt(sp)+' <small>/ '+fmt(c.limit)+'</small> <em class="'+(over ? 'neg' : '')+'">· '+(over ? 'перерасход '+fmt(-left) : 'осталось '+fmt(left))+'</em></div>' +
    '<div class="bar '+(over ? 'over' : '')+'"><i style="width:'+w+'%"></i></div>' +
    '<div class="foot"><span>'+list.length+' '+plural(list.length, ['операция','операции','операций'])+'</span><span>'+(dl != null ? 'осталось '+dl+' '+plural(dl, ['день','дня','дней']) : '')+'</span></div></div>';

function vGoals(){
  var h = '<div class="top"><div><div class="title">Мои цели</div><div class="hi" style="margin-top:0.25rem">Выберите основную — она будет на главной</div></div></div>';

function vAn(){
  var k = curKey(), sp = spentOf(k), d = dim(), dl = daysLeft();
  var passed = dl != null ? d - dl + 1 : (isPast() ? d : 0);
  var avg = passed > 0 ? sp / passed : 0;
  var forecast = (dl != null && passed > 0) ? avg * d : null;
  var h = '<div class="top"><div><div class="title">Аналитика</div><div class="hi">'+MONTHS[VM.m]+' '+VM.y+'</div></div><div class="mnav"><button data-act="mprev">‹</button><button data-act="mnext">›</button></div></div>';
  h += '<div class="kpis"><div class="kpi"><span>Потрачено</span><b>'+fmt(sp)+'</b></div><div class="kpi"><span>В среднем в день</span><b>'+fmt(avg)+'</b></div>' +
    '<div class="kpi w"><span>'+(forecast != null ? 'Прогноз трат до конца месяца' : 'Накоплено в целях за месяц')+'</span><b>'+fmt(forecast != null ? forecast : contribOf(k))+'</b></div></div>';
  var months = [], i;
  for (i = 5; i >= 0; i--) { var dt = new Date(VM.y, VM.m - i, 1), key = mk(dt.getFullYear(), dt.getMonth()); months.push({l: MSHORT[dt.getMonth()], inc: incomeOf(key), sp: spentOf(key)}); }
  var mx = Math.max(1, Math.max.apply(null, months.map(function(m){ return Math.max(m.inc, m.sp); })));
  h += '<div class="sec"><h2>Доход и расходы</h2></div><div class="card"><div class="chart">' + months.map(function(m){
    return '<div class="c"><div class="bars"><i class="a" style="height:'+(m.inc/mx*100)+'%"></i><i class="b" style="height:'+(m.sp/mx*100)+'%"></i></div><label>'+m.l+'</label></div>';
  }).join('') + '</div><div class="legend"><span><i style="background:var(--pink-l)"></i>Доход</span><span><i style="background:var(--pink-d)"></i>Расходы</span></div></div>';
  var rows = S.cats.map(function(c){ return {c:c, s:sum(catOps(k,c.id).map(function(o){ return o.amount; }))}; }).filter(function(r){ return r.s > 0; }).sort(function(a,b){ return b.s - a.s; });
  h += '<div class="sec"><h2>Куда уходят деньги</h2></div><div class="card">';
  h += rows.length ? rows.map(function(r){
    var p = Math.round(r.s / sp * 100);
    return '<div class="share"><div class="t"><span>'+esc(r.c.emoji)+' '+esc(r.c.name)+'</span><span>'+fmt(r.s)+' · '+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
  }).join('') : '<div class="empty">Добавьте расходы, и здесь появится разбивка</div>';
  return h + '</div>';
}

var GOAL_IDEAS = ['Ноутбук','Отпуск','Машина','Квартира','Подушка безопасности','Ремонт','Телефон','Свадьба'];
function openGoal(id){
  editId = id || null; var g = id ? goalById(id) : null;
  var ideas = g ? '' : '<div class="chips" style="margin:0.625rem 0 0">' + GOAL_IDEAS.map(function(x){ return '<button class="chip" data-act="gidea" data-v="'+x+'">'+x+'</button>'; }).join('') + '</div>';
  sheet('<h3>'+(g ? 'Цель' : 'На что копим?')+'</h3><label>На что хотите накопить</label><input id="g-name" value="'+esc(g ? g.name : '')+'" placeholder="Например, Отпуск">' + ideas +
    '<label>Сколько нужно, ₽</label><input id="g-target" inputmode="decimal" value="'+(g ? g.target : '')+'" placeholder="100000">' +
    '<label>За сколько месяцев</label><input id="g-months" inputmode="numeric" value="'+(g && g.months ? g.months : '')+'" placeholder="Например, 6">' +
    '<div class="chips" style="margin-top:0.625rem">' + [3,6,12,24].map(function(m){ return '<button class="chip" data-act="gmonths" data-v="'+m+'">'+m+' мес</button>'; }).join('') + '</div>' +
    '<div class="preview" id="g-prev"></div><button class="btn big" data-act="savegoal">Сохранить</button>');
  updGoal();

function updGoal(){
  var el = $('#g-prev'); if (!el) return;
  var tg_ = num($('#g-target').value), mo = Math.round(num($('#g-months').value)), g = editId ? goalById(editId) : null;
  var rest = tg_ - (g ? saved(g) : 0), inc = baseIncome(realKey());
  el.classList.remove('neg');
  if (tg_ <= 0 || mo <= 0) { el.textContent = 'Введите сумму и срок — посчитаю, сколько откладывать в месяц при зарплате ' + fmt(inc) + '.'; return; }
  if (rest <= 0) { el.textContent = 'Эта сумма уже накоплена 🎉'; return; }
  var r = calcPlan(rest, mo, inc);
  if (r.over) {
    var need = Math.ceil(rest / (inc * 0.3));
    el.classList.add('neg');
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес — это больше зарплаты (' + fmt(inc) + '). Реалистичнее копить около ' + need + ' ' + plural(need, ['месяц','месяца','месяцев']) + ' (30% зарплаты).';
  } else {
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес (' + Math.round(r.per / inc * 100) + '% зарплаты). На жизнь останется ≈ ' + fmt(r.free) + '/мес при зарплате ' + fmt(inc) + '.';
  }
}

function updContrib(){

  },
  optype: function(d, el){

    document.querySelectorAll('[data-act="opdate"]').forEach(function(b){ b.classList.toggle('on', b === el); });
  },
  kadd: function(d){ var i = $('#k-amt'); i.value = String(num(i.value) + Number(d.v)); updContrib(); },
  saveop: function(){
    var a = num($('#f-amt').value);
    if (a <= 0) { toast('Введите сумму'); return; }
    var date = $('#f-date').value || today();
    S.ops.push({id: uid(), type: opType, amount: a, catId: opType === 'expense' ? opCat : '', note: $('#f-note').value.trim(), date: date, t: Date.now()});

  },
  saveplan: function(){

    document.querySelectorAll('.plim').forEach(function(i){ var c = catById(i.dataset.id); if (c) c.limit = num(i.value); });
    save(); closeSheet(); render(); toast('Бюджет сохранён');
  },
  pickem: function(d){ $('#c-em').value = d.v; },
  gidea: function(d){ $('#g-name').value = d.v; },
  gmonths: function(d){ $('#g-months').value = d.v; updGoal(); },
  invite: function(){
    var link = 'https://t.me/' + BOT, text = 'Считаю расходы и коплю на цели в Копилке. Заходи!';
    var url = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text);
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
  },
  delaccount: function(){
    confirmBox('Удалить все ваши данные с сервера? Это нельзя отменить.', function(){
      api('DELETE', '/api/account').then(function(){
        S = defaults(); rev = 0; dirty = false;
        try { localStorage.removeItem(KEY); } catch(e){}
        render(); toast('Данные удалены');
      }).catch(function(){ toast('Не удалось удалить. Попробуйте позже'); });
    });
  },
  addpreset: function(d, el){
    S.cats.push({id: uid(), name: d.n, emoji: d.e, limit: 0});
    save(); el.remove(); render(); haptic(); toast('Добавлено: ' + d.n);
  },
  savecat: function(){
    var name = $('#c-name').value.trim(); if (!name) { toast('Введите название'); return; }
    var em = $('#c-em').value.trim() || '•', lim = num($('#c-lim').value);

    else S.cats.push({id: uid(), name: name, emoji: em, limit: lim});
    save(); closeSheet(); render();
  },
  delcat: function(d){
    var c = catById(d.id); if (!c) return;
    confirmBox('Удалить категорию «' + c.name + '»? Операции останутся без категории.', function(){
      S.cats = S.cats.filter(function(x){ return x.id !== d.id; }); save(); closeSheet(); render();
    });
  },
  savegoal: function(){
    var name = $('#g-name').value.trim(), t = num($('#g-target').value);
    if (!name) { toast('Введите название'); return; }
    if (t <= 0) { toast('Укажите сумму цели'); return; }
    var mo = Math.round(num($('#g-months').value));
    if (editId) {
      var g = goalById(editId); g.name = name; g.target = t;
      if (mo > 0) { if (g.months !== mo) g.start = today(); g.months = mo; } else { delete g.months; delete g.start; }
    } else {
      var n = {id: uid(), name: name, target: t, img: '', contribs: []};
      if (mo > 0) { n.months = mo; n.start = today(); }
      S.goals.push(n); if (!S.mainGoal) S.mainGoal = n.id;
    }
    save(); closeSheet(); render();
  },
  savecontrib: function(){
    var a = num($('#k-amt').value), g = goalById(editId);
    if (!g || a === 0) { toast('Введите сумму'); return; }
    if (saved(g) + a < 0) { toast('В цели нет столько денег'); return; }
    g.contribs.push({amount: a, date: isCur() ? today() : mk(VM.y, VM.m) + '-01', t: Date.now()});
    save(); closeSheet(); haptic('medium'); render();
    toast(a > 0 ? 'Отложено ' + fmt(a) : 'Снято ' + fmt(-a));
  },
  savesettings: function(){
    S.name = $('#s-name').value.trim(); S.defaultIncome = num($('#s-inc').value);
    save(); toast('Сохранено');
  },
  theme: function(d){ S.theme = d.v; save(); haptic(); render(); },
  scale: function(d){ S.scale = d.v; save(); haptic(); render(); },
  reset: function(){
    confirmBox('Удалить все данные и начать заново?', function(){ var th = S.theme, sc = S.scale; S = defaults(); S.theme = th; S.scale = sc; save(); render(); toast('Данные сброшены'); });

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-act],[data-close]'); if (!t) return;
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  if (t.dataset.tab) { TAB = t.dataset.tab; window.scrollTo(0, 0); haptic('light'); render(); return; }
  if (ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset, t);
});
document.addEventListener('input', function(e){
  var id = e.target.id, c = e.target.classList;
  if (c && (c.contains('plim') || id === 'p-inc')) updPlan();
  else if (id === 'g-target' || id === 'g-months') updGoal();
  else if (id === 'k-amt') updContrib();
  else if (id === 'f-date') document.querySelectorAll('[data-act="opdate"]').forEach(function(b){ b.classList.remove('on'); });
});
document.addEventListener('keydown', function(e){
  if (!$('#sheet').classList.contains('on')) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#sheet input')) {
    var b = $('#sheet .sfoot .btn'); if (b) { e.preventDefault(); b.click(); }
  }
});
document.addEventListener('focusin', function(e){
  if (!e.target.closest || !e.target.closest('#sheet .sbody')) return;
  setTimeout(function(){ try { e.target.scrollIntoView({block: 'center', behavior: 'smooth'}); } catch(_){} }, 320);
});
var drag = null;
document.addEventListener('touchstart', function(e){
  if (!e.target.closest || !e.target.closest('.shead')) return;
  var p = $('#sheet .panel'); if (!p) return;
  drag = {y: e.touches[0].clientY, dy: 0, p: p}; p.style.transition = 'none';
}, {passive: true});
document.addEventListener('touchmove', function(e){
  if (!drag) return;
  drag.dy = Math.max(0, e.touches[0].clientY - drag.y);
  drag.p.style.transform = 'translateY(' + drag.dy + 'px)';
}, {passive: true});
function endDrag(){
  if (!drag) return;
  var d = drag; drag = null; d.p.style.transition = '';
  if (d.dy > 80) { d.p.style.transform = 'translateY(100%)'; closeSheet(); setTimeout(function(){ d.p.style.transform = ''; }, 350); }
  else d.p.style.transform = '';
}
document.addEventListener('touchend', endDrag);
document.addEventListener('touchcancel', endDrag);

$('#file').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = '';
  if (!f || !pendingGoal) return;
  var r = new FileReader();
  r.onload = function(){
    var im = new Image();
    im.onload = function(){
      var sc = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      var g = goalById(pendingGoal);
      if (g) {
        g.img = c.toDataURL('image/jpeg', .75); save(); render();
        if (ONLINE) api('PUT', '/api/img/' + g.id, {img: g.img}).catch(function(){ toast('Не удалось загрузить фото на сервер'); });
      }
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
});

$('#fab').innerHTML = ic('plus', 34);

function boot(){
  applyTheme();
  if (!ONLINE) { render(); return; }
  $('#nav').style.display = 'none'; $('#fab').style.display = 'none';
  $('#app').innerHTML = '<div class="empty" style="padding-top:38vh;font-size:1.125rem">Загрузка…</div>';
  api('GET', '/api/state').then(function(r){
    if (typeof r.rev !== 'number') { var nb = new Error('no backend'); nb.status = 404; throw nb; }
    BOT = r.bot || '';
    if (r.state) { S = normalize(r.state); rev = r.rev; cacheLocal(); }
    else {
      S = normalize(S);   // новый пользователь: отправляем начальные данные на сервер
      S.goals.forEach(function(g){ if (g.img) api('PUT', '/api/img/' + g.id, {img: g.img}).catch(function(){}); });
      save();
    }
    syncState = 'ok';
  }).catch(function(e){
    if (e.status === 404 || e.status === 405) {   // сервера нет (например, GitHub Pages): храним данные на телефоне
      ONLINE = false; syncState = 'local'; S = normalize(S); return;
    }
    if (e.status === 401) {
      blocked = true;
      $('#app').innerHTML = '<div class="card empty">Не удалось войти. Закройте приложение и откройте его заново через бота в Telegram.</div>';
      return;
    }
    S = normalize(S); syncState = 'offline'; toast('Нет связи с сервером. Работаю офлайн');
  }).then(function(){
    if (blocked) return;
    $('#nav').style.display = ''; render();
  });
}

document.addEventListener('visibilitychange', function(){
  if (!ONLINE || blocked) return;
  if (document.hidden) { if (dirty) { clearTimeout(pushT); push(); } return; }
  if (inflight || pending || dirty) return;
  api('GET', '/api/state').then(function(r){
    if (r.state && r.rev > rev) { S = normalize(r.state); rev = r.rev; syncState = 'ok'; cacheLocal(); render(); }
  }).catch(function(){});
});

boot();
})();
</script>
