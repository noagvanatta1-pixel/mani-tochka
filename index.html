<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef0f7">
<title>Копилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Копилка: кобальт + монетная латунь */
:root{
  --bg:#eef0f7;--card:#fff;--ink:#101936;--muted:#6b7494;
  --pink:#7d8cff;--pink-d:#2f45ff;--pink-l:#e4e8ff;
  --green:#0f9d73;--red:#e5484d;--r:1.125rem;--nav:4.25rem;
  --sh:16,25,54;--btn:#2f45ff;--bal1:#3a50ff;--bal2:#2236d6;--bar1:#7d8cff;
  --dangerbg:#fde9ea;--line:#e3e6f1;--grab:#cfd4e6;--fab:#ffc83d;--toast:#101936;--coin:#ffc83d;--coinink:#3b2a00;
  --fd:'Unbounded','Onest',system-ui,sans-serif;
}
html[data-theme=mint]{--bg:#ecf3f0;--ink:#0e2a26;--muted:#617a74;--pink:#4fb59d;--pink-d:#0f7d68;--pink-l:#d9eee7;--sh:14,42,38;--btn:#0f7d68;--bal1:#13917a;--bal2:#0b6454;--bar1:#4fb59d;--line:#dbe8e3;--grab:#c2d6cf;--toast:#0e2a26}
html[data-theme=lav]{--bg:#f2eff7;--ink:#241a3a;--muted:#7a7092;--pink:#a58be0;--pink-d:#6b3fd1;--pink-l:#e8e0f8;--sh:36,26,58;--btn:#6b3fd1;--bal1:#7a4fe0;--bal2:#5a2fb8;--bar1:#a58be0;--line:#e5def2;--grab:#d3c9e8;--toast:#241a3a}
html[data-theme=sky]{--bg:#eaf3f8;--ink:#0d2a3b;--muted:#5f7c8d;--pink:#4fb0d8;--pink-d:#0c7fae;--pink-l:#d6ecf6;--sh:13,42,59;--btn:#0c7fae;--bal1:#1493c4;--bal2:#0a6a93;--bar1:#4fb0d8;--line:#d9e8f0;--grab:#c1d7e3;--toast:#0d2a3b}
html[data-theme=dark]{--bg:#0d1226;--card:#161d38;--ink:#eef0fb;--muted:#8f98bd;--pink:#7d8cff;--pink-d:#98a5ff;--pink-l:#1f2849;--sh:0,0,0;--btn:#4a5eff;--bal1:#3347f0;--bal2:#1b2aa8;--bar1:#7d8cff;--dangerbg:#3a1f2b;--line:#242d50;--grab:#3a4472;--toast:#2a3460;--green:#2fc596;--red:#ff7a80}
html[data-theme=gra]{--bg:#111214;--card:#1b1c20;--ink:#f0f0f2;--muted:#9a9ca6;--pink:#c9a24a;--pink-d:#ffc24d;--pink-l:#26272d;--sh:0,0,0;--btn:#d98e0b;--bal1:#4a4d57;--bal2:#2c2e36;--bar1:#c9a24a;--dangerbg:#3a1f2b;--line:#2a2b31;--grab:#44464f;--toast:#2b2d34;--green:#2fc596;--red:#ff7a80}
html[data-theme=emd]{--bg:#07140e;--card:#0f2218;--ink:#e9f6ef;--muted:#86a799;--pink:#3fc08f;--pink-d:#4fd9a2;--pink-l:#173325;--sh:0,0,0;--btn:#14936a;--bal1:#17936a;--bal2:#0b5f44;--bar1:#3fc08f;--dangerbg:#3a1f2b;--line:#1b3528;--grab:#2c5440;--toast:#1c3a2c;--green:#2fc596;--red:#ff7a80}
html[data-theme=win]{--bg:#180c13;--card:#27141f;--ink:#fbeef3;--muted:#b392a1;--pink:#e0668f;--pink-d:#ff8fb2;--pink-l:#3a1c2b;--sh:0,0,0;--btn:#c23567;--bal1:#b22d5d;--bal2:#7a1a3f;--bar1:#e0668f;--dangerbg:#3a1f2b;--line:#3a1e2c;--grab:#5d3347;--toast:#42202f;--green:#2fc596;--red:#ff7a80}
html[data-theme=oce]{--bg:#061520;--card:#0e2433;--ink:#e8f4fb;--muted:#86a6ba;--pink:#3fb0e4;--pink-d:#5cc8f5;--pink-l:#143549;--sh:0,0,0;--btn:#1580b3;--bal1:#1a8cc2;--bal2:#0b5d86;--bar1:#3fb0e4;--dangerbg:#3a1f2b;--line:#173649;--grab:#2c566f;--toast:#183a50;--green:#2fc596;--red:#ff7a80}
html[data-theme=vio]{--bg:#120d22;--card:#1e1638;--ink:#f1ecff;--muted:#9d93be;--pink:#a284f7;--pink-d:#b9a1ff;--pink-l:#2b2150;--sh:0,0,0;--btn:#7c4ff0;--bal1:#7447e6;--bal2:#4b27ad;--bar1:#a284f7;--dangerbg:#3a1f2b;--line:#2a2150;--grab:#453a78;--toast:#2d2358;--green:#2fc596;--red:#ff7a80}
html[data-theme=emb]{--bg:#170e09;--card:#26160e;--ink:#fcf0e8;--muted:#b39784;--pink:#ec7a3c;--pink-d:#ff9a60;--pink-l:#3a2216;--sh:0,0,0;--btn:#d05a1c;--bal1:#c4531a;--bal2:#8a3510;--bar1:#ec7a3c;--dangerbg:#3a1f2b;--line:#3a2318;--grab:#5c3d2b;--toast:#432818;--green:#2fc596;--red:#ff7a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font-size:13.76px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
body{padding:1rem 1rem calc(var(--nav) + env(safe-area-inset-bottom) + 2.25rem)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
h1,h2,h3,p{margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:0.5rem 0.25rem 1.125rem}
.hi{color:var(--muted);font-size:1.0625rem;font-weight:600}
.title{font-size:1.75rem;font-weight:800;line-height:1.15}
.mnav{display:flex;gap:0.5rem}
.mnav button{width:2.375rem;height:2.375rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);font-size:1.25rem;font-weight:800;line-height:1}
.sec{display:flex;align-items:center;justify-content:space-between;margin:1.375rem 0.25rem 0.75rem}
.sec h2{font-size:1.3125rem;font-weight:800}
.sec a{color:var(--pink-d);font-weight:700;font-size:1rem;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:0.875rem;box-shadow:0 0.375rem 1.5rem rgba(var(--sh),.08);margin-bottom:0.75rem}
.gimg{position:relative;height:10.625rem;border-radius:1.25rem;overflow:hidden;background:linear-gradient(135deg,var(--pink-l),var(--pink))}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gimg .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.badge{position:absolute;left:0.875rem;top:0.875rem;background:var(--pink);color:#fff;font-weight:700;font-size:0.875rem;padding:0.5625rem 1rem;border-radius:1.25rem}
.ib{position:absolute;width:2.75rem;height:2.75rem;border-radius:50%;background:rgba(255,255,255,.88);color:var(--pink-d);display:flex;align-items:center;justify-content:center}
.ib.del{right:0.625rem;top:0.625rem}.ib.star{right:3.875rem;top:0.625rem}.ib.cam{right:0.625rem;bottom:0.625rem}
.grow{display:flex;align-items:center;justify-content:space-between;margin:1rem 0.375rem 0.25rem}
.gname{font-size:1.4375rem;font-weight:800;cursor:pointer}
.pill{background:var(--pink-l);color:var(--pink-d);font-weight:800;border-radius:1.125rem;padding:0.5rem 1rem;font-size:1rem}
.gsum{margin:0.25rem 0.375rem 0.75rem;font-size:1.125rem;font-weight:600;color:var(--muted)}
.gsum b{color:var(--ink);font-weight:700}
.gplan{margin:0 0.375rem 0.875rem;background:var(--pink-l);border-radius:1.125rem;padding:0.75rem 0.875rem;font-size:0.9375rem;font-weight:600;line-height:1.35;cursor:pointer}
.gplan b{font-weight:800}
.gplan small{display:block;font-size:0.875rem;color:var(--green);font-weight:700;margin-top:0.1875rem}
.gplan.neg small{color:var(--red)}
.gplan.hint{color:var(--muted);font-weight:600}
.preview{margin:0.875rem 0.25rem 0;background:var(--pink-l);border-radius:1.125rem;padding:0.75rem 0.875rem;font-weight:700;font-size:0.9375rem;line-height:1.4}
.preview.neg{color:var(--red)}
.bar{height:0.75rem;border-radius:0.625rem;background:var(--pink-l);overflow:hidden;margin:0 0.375rem 1rem}
.bar i{display:block;height:100%;border-radius:0.625rem;background:linear-gradient(90deg,var(--bar1),var(--pink-d));transition:width .4s}
.bar.over i{background:linear-gradient(90deg,#f19aae,var(--red))}
.btn{width:100%;background:var(--btn);color:#fff;font-weight:800;font-size:1.125rem;padding:0.9375rem;border-radius:1.375rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;box-shadow:0 0.5rem 1.25rem rgba(var(--sh),.25)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--pink-l);color:var(--pink-d);box-shadow:none}
.btn.danger{background:var(--dangerbg);color:var(--red);box-shadow:none}
.btn.big{margin-top:1.125rem}
.bal{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bal1),var(--bal2));color:#fff;border-radius:1.75rem;padding:1.25rem 1.125rem 1.125rem;margin-bottom:0.875rem;box-shadow:0 0.75rem 1.875rem rgba(var(--sh),.28)}
.bal:before{content:"";position:absolute;right:-4.375rem;top:-3.75rem;width:16.25rem;height:16.25rem;border-radius:50%;background:rgba(255,255,255,.12)}
.bal .lbl{display:flex;align-items:center;gap:0.625rem;font-size:1.125rem;font-weight:600;opacity:.95;position:relative}
.bal .big{font-size:2.875rem;font-weight:800;margin:0.75rem 0 1rem;letter-spacing:-1px;position:relative}
.bal .row{display:flex;gap:0.75rem;position:relative}
.bal .mini{flex:1;background:rgba(255,255,255,.2);border-radius:1.375rem;padding:0.875rem 1rem}
.bal .mini span{display:block;font-size:1rem;opacity:.9;font-weight:600}
.bal .mini b{font-size:1.375rem;font-weight:800}
.plan{display:flex;align-items:center;gap:1rem;cursor:pointer}
.plan .ico{width:3.625rem;height:3.625rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);display:flex;align-items:center;justify-content:center;flex:none}
.plan b{display:block;font-size:1.1875rem;font-weight:800}
.plan span{color:var(--muted);font-size:0.875rem;font-weight:600}
.cat .h{display:flex;align-items:center;gap:0.875rem;margin-bottom:0.75rem}
.cat .em{font-size:2.125rem;line-height:1;width:2.875rem;text-align:center}
.cat .nm{flex:1;font-size:1.3125rem;font-weight:800}
.edit{width:2.625rem;height:2.625rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);display:flex;align-items:center;justify-content:center}
.cat .amt{font-size:1.6875rem;font-weight:800;margin:0 0.25rem 0.625rem}
.cat .amt small{font-size:1.125rem;color:var(--muted);font-weight:600}
.cat .amt em{font-style:normal;font-size:1.125rem;font-weight:700;color:var(--green)}
.cat .amt em.neg{color:var(--red)}
.cat .foot{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:0.9375rem;margin:0 0.25rem}
.budget .n{font-size:2.375rem;font-weight:800;margin:0.25rem 0 0.75rem}
.budget .n small{font-size:1.625rem;color:var(--muted);font-weight:600}
.ok{color:var(--green);font-weight:700;font-size:1.0625rem}.ok.neg{color:var(--red)}
.pf{display:flex;gap:0.875rem;align-items:center}
.pf .em{font-size:2.125rem;width:2.875rem;text-align:center}
.pf .b{flex:1}
.pf .t{display:flex;justify-content:space-between;font-size:1.1875rem;font-weight:800;margin-bottom:0.5rem}
.pf .t span{font-size:1rem;font-weight:600}
.pf .bar{margin:0 0 0.5rem}
.pf .ok{font-size:0.9375rem}
.op{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 0.25rem;border-bottom:1px solid var(--line);cursor:pointer}
.op:last-child{border:0}
.op .em{font-size:1.75rem;width:2.5rem;text-align:center}
.op .m{flex:1}.op .m b{display:block;font-size:1.125rem}.op .m span{font-size:0.875rem;color:var(--muted);font-weight:600}
.op .a{font-weight:800;font-size:1.125rem}.op .a.in{color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:1.125rem 0.5rem;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:0.875rem}
.kpi{background:var(--card);border-radius:1.5rem;padding:1rem;box-shadow:0 0.375rem 1.5rem rgba(var(--sh),.08)}
.kpi span{display:block;color:var(--muted);font-weight:600;font-size:0.9375rem}
.kpi b{font-size:1.5rem;font-weight:800}
.kpi.w{grid-column:1/3}
.chart{display:flex;align-items:flex-end;gap:0.625rem;height:10.625rem;padding:0 0.25rem}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.5rem;height:100%;justify-content:flex-end}
.chart .bars{display:flex;align-items:flex-end;gap:0.25rem;height:100%;width:100%;justify-content:center}
.chart .bars i{display:block;width:42%;border-radius:0.5rem 0.5rem 0.25rem 0.25rem;min-height:0.1875rem}
.chart .bars .a{background:var(--pink-l)}.chart .bars .b{background:linear-gradient(180deg,var(--bar1),var(--pink-d))}
.chart label{font-size:0.875rem;color:var(--muted);font-weight:700}
.legend{display:flex;gap:1rem;margin:0.75rem 0.25rem 0;font-size:0.875rem;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:0.75rem;height:0.75rem;border-radius:0.25rem;margin-right:0.375rem;vertical-align:-1px}
.share{margin-bottom:0.875rem}.share .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:0.375rem;font-size:1.0625rem}
.share .bar{margin:0}
.set label,.panel label{display:block;margin:0.875rem 0.25rem 0.375rem;font-weight:700;color:var(--muted);font-size:0.9375rem}
input.f,.panel input{width:100%;font-size:max(16px,1.1rem);font-weight:600;padding:.8rem 1rem;border-radius:1rem;border:2px solid var(--pink-l);background:var(--card);color:var(--ink);outline:none}
input.f:focus,.panel input:focus{border-color:var(--pink)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-radius:1.875rem 1.875rem 0 0;display:flex;justify-content:space-around;box-shadow:0 -0.25rem 1.5rem rgba(var(--sh),.12);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0.125rem;font-size:0.8125rem;font-weight:700;color:var(--muted);padding:0.5rem 0.375rem;flex:1}
.nav button .i{width:3.25rem;height:2.25rem;border-radius:1.125rem;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--pink-d)}.nav button.on .i{background:var(--pink-l)}
.fab{position:fixed;right:1.25rem;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 1.125rem);width:3.75rem;height:3.75rem;border-radius:50%;background:var(--fab);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0.625rem 1.5rem rgba(var(--sh),.4);z-index:15}
.fab{transition:opacity .2s,transform .1s}
.fab:active{transform:scale(.94)}
#sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;pointer-events:none}
#sheet .back{position:absolute;inset:0;background:rgba(20,10,16,.45);opacity:0;transition:opacity .25s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:92%;background:var(--card);border-radius:1.5rem 1.5rem 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -.5rem 2rem rgba(0,0,0,.18)}
#sheet.on{pointer-events:auto}#sheet.on .back{opacity:1}#sheet.on .panel{transform:none}
.shead{flex:none;padding:.6rem 1.1rem .5rem;touch-action:none}
.grab{width:2.6rem;height:.3rem;border-radius:.2rem;background:var(--grab);margin:0 auto .7rem}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.panel h3{font-size:1.4rem;font-weight:800}
.x{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--pink-l);color:var(--pink-d);font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 1.1rem 1rem}
.sfoot{flex:none;padding:.7rem 1.1rem calc(.8rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sfoot .btn.big{margin:0}
.amtbox{display:flex;align-items:baseline;justify-content:center;gap:.4rem;margin:.9rem 0 .2rem}
.panel .amtbox input{width:auto;max-width:70%;border:0;background:transparent;text-align:center;font-size:max(28px,2.4rem);font-weight:800;padding:.2rem;border-radius:0}
.amtbox span{font-size:1.8rem;font-weight:800;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.6rem .3rem;min-height:4.4rem;border-radius:1rem;background:var(--pink-l);font-weight:700;font-size:.85rem;line-height:1.15;text-align:center;border:2px solid transparent}
.cg b{font-size:1.5rem;line-height:1;font-weight:400}
.cg.on{border-color:var(--pink-d);background:var(--card);box-shadow:0 .2rem .6rem rgba(var(--sh),.2)}
.row2{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row2 input[type=date]{flex:1;min-width:8rem;padding:.6rem .8rem}
.seg{display:flex;background:var(--pink-l);border-radius:1.25rem;padding:0.3125rem;margin:0.75rem 0 0.25rem}
.seg button{flex:1;padding:0.75rem;border-radius:1rem;font-weight:800;font-size:1.0625rem;color:var(--pink-d)}
.seg button.on{background:var(--card);box-shadow:0 0.1875rem 0.625rem rgba(var(--sh),.2)}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem}
.chip{padding:.55rem .85rem;border-radius:1rem;background:var(--pink-l);font-weight:700;font-size:.95rem}
.chip.on{background:var(--pink-d);color:#fff}
.plrow{display:flex;align-items:center;gap:0.625rem;margin-top:0.625rem}
.plrow .em{font-size:1.625rem;width:2.25rem;text-align:center}
.plrow span{flex:1;font-weight:700;font-size:1.0625rem}
.plrow input{width:8.125rem;text-align:right;padding:0.75rem 0.875rem}
.free{margin:.6rem 0 0;padding:.6rem .8rem;border-radius:1rem;background:var(--pink-l);font-weight:800;font-size:.95rem}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:0.625rem;margin-top:0.375rem}
.th{border-radius:1.375rem;padding:0.75rem 0.375rem;background:var(--pink-l);font-weight:700;font-size:0.875rem;display:flex;flex-direction:column;align-items:center;gap:0.5rem;border:0.1875rem solid transparent;color:var(--ink)}
.th.on{border-color:var(--pink-d)}
.th i{width:2.875rem;height:2.875rem;border-radius:50%;display:block;box-shadow:0 0.25rem 0.625rem rgba(0,0,0,.14)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 6.25rem);transform:translateX(-50%) translateY(1.25rem);background:var(--toast);color:#fff;padding:0.75rem 1.25rem;border-radius:1.25rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.seg.scope{margin:0 0 .9rem}
.warnbox{background:var(--dangerbg);color:var(--red);border-radius:1.25rem;padding:.8rem 1rem;margin-bottom:.9rem;font-weight:700;font-size:.9375rem}
.fcode{font-family:ui-monospace,Menlo,monospace;font-size:1.75rem;font-weight:800;letter-spacing:.18em;text-align:center;background:var(--pink-l);border-radius:1.25rem;padding:.9rem;margin:.5rem 0}
.mem{display:flex;align-items:center;gap:.6rem;padding:.55rem .2rem;font-weight:700}
.mem i{font-style:normal;background:var(--pink-l);border-radius:50%;width:2rem;height:2rem;display:flex;align-items:center;justify-content:center}
.tog{display:flex;align-items:center;justify-content:space-between;padding:.6rem .25rem;font-weight:700}
.tog button{padding:.4rem .9rem;border-radius:1rem;background:var(--pink-l);color:var(--pink-d);font-weight:800}
.tog button.on{background:var(--pink-d);color:#fff}

var blocked = false;

function qs(sc){ return sc === 'fam' ? '?scope=family' : ''; }
function keyOf(sc){ return sc === 'fam' ? KEY + '_fam' : KEY; }

  if (body != null) opt.body = JSON.stringify(body);

    return r.json().catch(function(){ return {}; }).then(function(j){

function normalize(s){

  if (!Array.isArray(s.recurring)) s.recurring = [];
  if (!s.income || typeof s.income !== 'object') s.income = {};
  if (typeof s.defaultIncome !== 'number') s.defaultIncome = d.defaultIncome;
  if (typeof s.name !== 'string') s.name = '';
  if (!THEMES[s.theme]) s.theme = 'pink';

  s.goals.forEach(function(g){ if (!Array.isArray(g.contribs)) g.contribs = []; if (g.img == null) g.img = ''; });
  if (!s.goals.some(function(g){ return g.id === s.mainGoal; })) s.mainGoal = s.goals[0] ? s.goals[0].id : '';

function famDefaults(){ var d = defaults(); d.goals = []; d.mainGoal = ''; d.defaultIncome = 0; d.onboarded = true; return d; }

}
function save(){ slots[scope].s = S; markDirty(scope); }
function push(sc){
  sc = sc || scope;

  if (sl.inflight) { sl.pending = true; return; }
  sl.inflight = true; sl.pending = false; sl.dirty = false;
  api('PUT', '/api/state' + qs(sc), {state: strip(sl.s), rev: sl.rev}).then(function(r){
    sl.rev = r.rev; syncState = 'ok';

function realKey(){ var n = new Date(); return mk(n.getFullYear(), n.getMonth()); }
function monthsSince(iso){
  var p = String(iso || today()).split('-'), n = new Date();
  return (n.getFullYear() - +p[0]) * 12 + (n.getMonth() - (+p[1] - 1));

function calcPlan(rest, months, inc){
  var per = Math.ceil(rest / months / 100) * 100;

}
function plan(g){

  r.left = left; return r;
}

function openCat(id){

var GOAL_IDEAS = ['Ноутбук','Отпуск','Машина','Квартира','Подушка безопасности','Ремонт','Телефон','Свадьба'];
function openGoal(id){
  editId = id || null; var g = id ? goalById(id) : null;
  var ideas = g ? '' : '<div class="chips" style="margin:0.625rem 0 0">' + GOAL_IDEAS.map(function(x){ return '<button class="chip" data-act="gidea" data-v="'+x+'">'+x+'</button>'; }).join('') + '</div>';
  sheet('<h3>'+(g ? 'Цель' : 'На что копим?')+'</h3><label>На что хотите накопить</label><input id="g-name" value="'+esc(g ? g.name : '')+'" placeholder="Например, Отпуск">' + ideas +
    '<label>Сколько нужно, ₽</label><input id="g-target" inputmode="decimal" value="'+(g ? g.target : '')+'" placeholder="100000">' +
    '<label>За сколько месяцев</label><input id="g-months" inputmode="numeric" value="'+(g && g.months ? g.months : '')+'" placeholder="Например, 6">' +
    '<div class="chips" style="margin-top:0.625rem">' + [3,6,12,24].map(function(m){ return '<button class="chip" data-act="gmonths" data-v="'+m+'">'+m+' мес</button>'; }).join('') + '</div>' +
    '<div class="preview" id="g-prev"></div><button class="btn big" data-act="savegoal">Сохранить</button>');
  updGoal();
}
function updGoal(){
  var el = $('#g-prev'); if (!el) return;
  var tg_ = num($('#g-target').value), mo = Math.round(num($('#g-months').value)), g = editId ? goalById(editId) : null;
  var rest = tg_ - (g ? saved(g) : 0), inc = baseIncome(realKey());
  el.classList.remove('neg');
  if (tg_ <= 0 || mo <= 0) { el.textContent = 'Введите сумму и срок — посчитаю, сколько откладывать в месяц при зарплате ' + fmt(inc) + '.'; return; }
  if (rest <= 0) { el.textContent = 'Эта сумма уже накоплена 🎉'; return; }
  var r = calcPlan(rest, mo, inc);
  if (r.over) {
    var need = Math.ceil(rest / (inc * 0.3));
    el.classList.add('neg');
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес — это больше зарплаты (' + fmt(inc) + '). Реалистичнее копить около ' + need + ' ' + plural(need, ['месяц','месяца','месяцев']) + ' (30% зарплаты).';
  } else {
    el.textContent = 'Откладывать ≈ ' + fmt(r.per) + '/мес (' + Math.round(r.per / inc * 100) + '% зарплаты). На жизнь останется ≈ ' + fmt(r.free) + '/мес при зарплате ' + fmt(inc) + '.';
  }
}

function openContrib(id){
  editId = id; var g = goalById(id); if (!g) return;
  sheet('<h3>'+esc(g.name)+'</h3><div class="hi" style="margin:.2rem 0 0">Накоплено '+fmt(saved(g))+' из '+fmt(g.target)+'</div>' +
    '<div class="amtbox"><input id="k-amt" inputmode="decimal" placeholder="0" autocomplete="off"><span>₽</span></div>' +
    '<div class="chips" style="justify-content:center">' + [1000,5000,10000,20000].map(function(v){ return '<button class="chip" data-act="kadd" data-v="'+v+'">+ '+v.toLocaleString('ru-RU')+'</button>'; }).join('') + '</div>' +
    '<div class="preview" id="k-prev" style="display:none;text-align:center"></div>' +
    '<div class="hi" style="margin:.7rem 0 0;font-size:.85rem;text-align:center">Чтобы забрать деньги из цели, введите сумму со знаком «−»</div>' +
    '<button class="btn big" data-act="savecontrib">Добавить</button>');
  setTimeout(function(){ var a = $('#k-amt'); if (a) a.focus(); }, 320);
}
function updContrib(){
  var el = $('#k-prev'), g = goalById(editId); if (!el || !g) return;
  var a = num($('#k-amt').value), after = saved(g) + a;
  if (a === 0) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = after < 0 ? 'В цели нет столько денег' : 'После: ' + fmt(after) + ' из ' + fmt(g.target) + ' (' + pct(after, g.target) + '%)';
}

        if (af > cc.limit && bf <= cc.limit) limitMsg = '⚠️ Лимит по «' + cc.name + '» превышен';

      }

    S.ops.push({id: uid(), type: opType, amount: a, catId: opType === 'expense' ? opCat : '', note: $('#f-note').value.trim(), date: date, t: Date.now(), by: tgUser ? tgUser.id : 0});

    sheet('<h3>Операции в CSV</h3><div class="hi" style="font-weight:600;margin:.2rem 0 .6rem">Скопируйте и вставьте в Excel или Google Таблицы (разделитель — точка с запятой).</div><textarea class="csv" id="csv-text" readonly></textarea>' +
      '<button class="btn big" data-act="copycsv">Скопировать</button>');
    $('#csv-text').value = csvText();
  },
  copycsv: function(){ copyText($('#csv-text').value); },
  onboardskip: function(){ S.onboarded = true; save(); closeSheet(); render(); },
  onboarddone: function(){
    var inc = num($('#o-inc').value), name = $('#o-goal').value.trim(), t = num($('#o-target').value), mo = Math.round(num($('#o-months').value));
    if (inc > 0) S.defaultIncome = inc;
    if (name && t > 0) {
      var g = {id: uid(), name: name, target: t, img: '', contribs: []};
      if (mo > 0) { g.months = mo; g.start = today(); }
      S.goals = [g]; S.mainGoal = g.id;
    }
    S.onboarded = true; save(); closeSheet(); render();
    toast('Готово! Теперь добавьте первую трату'); setTimeout(function(){ if (!$('#sheet').classList.contains('on')) openOp(); }, 900);
  },
  refuse: function(){
    var code = ($('#ref-code').value || '').trim(); if (!code) { toast('Введите код'); return; }
    api('POST', '/api/ref/use', {code: code}).then(function(r){ REF = r; render(); toast('Код принят'); })
      .catch(function(e){ toast(e.status === 404 ? 'Такого кода нет' : e.status === 409 ? 'Код уже применён' : 'Не удалось применить'); });
  },
  reset: function(){
    confirmBox('Удалить все данные и начать заново?', function(){ var th = S.theme, sc = S.scale; S = scope === 'fam' ? famDefaults() : defaults(); S.theme = th; S.scale = sc; save(); render(); toast('Данные сброшены'); });
  }
};

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-act],[data-close]'); if (!t) return;
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  if (t.dataset.tab) { TAB = t.dataset.tab; window.scrollTo(0, 0); haptic('light'); render(); return; }
  if (ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset, t);
});
document.addEventListener('input', function(e){
  var id = e.target.id, c = e.target.classList;
  if (c && (c.contains('plim') || id === 'p-inc')) updPlan();
  else if (id === 'g-target' || id === 'g-months') updGoal();
  else if (id === 'k-amt') updContrib();
  else if (id === 'f-date') document.querySelectorAll('[data-act="opdate"]').forEach(function(b){ b.classList.remove('on'); });
});
document.addEventListener('keydown', function(e){
  if (!$('#sheet').classList.contains('on')) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#sheet input')) {
    var b = $('#sheet .sfoot .btn'); if (b) { e.preventDefault(); b.click(); }
  }
});
document.addEventListener('focusin', function(e){
  if (!e.target.closest || !e.target.closest('#sheet .sbody')) return;
  setTimeout(function(){ try { e.target.scrollIntoView({block: 'center', behavior: 'smooth'}); } catch(_){} }, 320);
});
var drag = null;
document.addEventListener('touchstart', function(e){
  if (!e.target.closest || !e.target.closest('.shead')) return;
  var p = $('#sheet .panel'); if (!p) return;
  drag = {y: e.touches[0].clientY, dy: 0, p: p}; p.style.transition = 'none';
}, {passive: true});
document.addEventListener('touchmove', function(e){
  if (!drag) return;
  drag.dy = Math.max(0, e.touches[0].clientY - drag.y);
  drag.p.style.transform = 'translateY(' + drag.dy + 'px)';
}, {passive: true});
function endDrag(){
  if (!drag) return;
  var d = drag; drag = null; d.p.style.transition = '';
  if (d.dy > 80) { d.p.style.transform = 'translateY(100%)'; closeSheet(); setTimeout(function(){ d.p.style.transform = ''; }, 350); }
  else d.p.style.transform = '';
}
document.addEventListener('touchend', endDrag);
document.addEventListener('touchcancel', endDrag);

$('#file').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = '';
  if (!f || !pendingGoal) return;
  var r = new FileReader();
  r.onload = function(){
    var im = new Image();
    im.onload = function(){
      var sc = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      var g = goalById(pendingGoal);
      if (g) {
        g.img = c.toDataURL('image/jpeg', .75); save(); render();
        if (ONLINE) api('PUT', '/api/img/' + g.id + qs(scope), {img: g.img}).catch(function(){ toast('Не удалось загрузить фото на сервер'); });
      }
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
});

$('#fab').innerHTML = ic('plus', 34);
(function(){ var t; window.addEventListener('scroll', function(){ var f = $('#fab'); f.style.opacity = '.0'; f.style.pointerEvents = 'none'; clearTimeout(t); t = setTimeout(function(){ f.style.opacity = ''; f.style.pointerEvents = ''; }, 350); }, {passive: true}); })();


/* ---------- Семья, регулярные платежи, напоминания, экспорт ---------- */
var REF = null, recCat = '';
function scopeBar(){
  return '<div class="seg scope"><button class="'+(scope === 'me' ? 'on' : '')+'" data-act="scope" data-v="me">Личный</button>' +
    '<button class="'+(scope === 'fam' ? 'on' : '')+'" data-act="scope" data-v="fam">'+(FAM && FAM.family ? 'Семья' : 'Семья ＋')+'</button></div>';
}
function overBanner(k){
  var over = S.cats.filter(function(c){ return c.limit > 0 && sum(catOps(k, c.id).map(function(o){ return o.amount; })) > c.limit; });
  return over.length ? '<div class="warnbox">⚠️ Превышен лимит: ' + over.map(function(c){ return esc(c.name); }).join(', ') + '</div>' : '';
}
function loadFamInfo(){
  return api('GET', '/api/family').then(function(r){ FAM = r; return r; });
}
function loadFam(){
  var sl = slots.fam;
  return api('GET', '/api/state?scope=family').then(function(r){
    if (r.state) { sl.s = normalize(r.state); sl.rev = r.rev; cacheLocal('fam'); }
    else { sl.s = famDefaults(); sl.rev = r.rev || 0; markDirty('fam'); }
  }).catch(function(e){
    var c = null; try { c = JSON.parse(localStorage.getItem(keyOf('fam'))); } catch(x){}
    if (c && c.cats) { sl.s = normalize(c); return; }
    throw e;
  });
}
function setScope(to){
  if (to === scope) return;
  if (to === 'fam') {
    if (!FAM || !FAM.family) { openFamily(); return; }
    var go = function(){ slots[scope].s = S; scope = 'fam'; S = slots.fam.s; applyRecurring(); render(); haptic('light'); };
    if (slots.fam.s) go(); else loadFam().then(go).catch(function(){ toast('Не удалось загрузить семью'); });
  } else {
    slots[scope].s = S; scope = 'me'; S = slots.me.s; render(); haptic('light');
  }
}
function openFamily(){
  if (!FAM) { loadFamInfo().then(openFamily).catch(function(){ toast('Нет связи с сервером'); }); return; }
  var f = FAM.family;
  if (!f) {
    sheet('<h3>Семейный бюджет</h3>' +
      '<div class="hi" style="margin:.2rem 0 .6rem;font-weight:600">Общий бюджет, цели и траты на двоих. У каждого свой Telegram, а личные данные остаются только вашими: переключайтесь между «Личный» и «Семья».</div>' +
      (FAM.paid && !FAM.premium ? '<div class="warnbox">Создать семью можно с подпиской. Присоединиться к семье по коду партнёра можно бесплатно.</div>' : '') +
      '<label>Уже есть код от партнёра?</label><input id="fam-code" placeholder="Например, K7M2QX9P" autocomplete="off" autocapitalize="characters" maxlength="12">' +
      '<button class="btn ghost" style="margin-top:.6rem" data-act="famjoin">Вступить в семью</button>' +
      '<button class="btn big" data-act="famcreate">Создать семью</button>');
    return;
  }
  sheet('<h3>Наша семья</h3>' +
    f.members.map(function(m){ return '<div class="mem"><i>'+esc((m.name || '?').slice(0,1).toUpperCase())+'</i>'+esc(m.name || 'Участник')+(tgUser && m.id === tgUser.id ? ' (вы)' : '')+'</div>'; }).join('') +
    (f.members.length < FAM.max ? '<label>Код для партнёра</label><div class="fcode">'+esc(f.code)+'</div>' +
      '<div class="hi" style="font-size:.85rem;text-align:center;margin:0 0 .6rem">Партнёр открывает бота → вкладка «Семья ＋» → вводит код</div>' +
      '<button class="btn big" data-act="famshare">Отправить приглашение</button>' : '<div class="hi" style="margin:.6rem 0">Вы вдвоём — всё общее на месте 💞</div>') +
    '<button class="btn danger" style="margin-top:.8rem" data-act="famleave">Выйти из семьи</button>');
}
function familyCard(){
  if (!ONLINE) return '';
  var f = FAM && FAM.family;
  return '<div class="card set"><label style="margin-top:0">Семейный бюджет</label>' +
    '<div class="hi" style="margin:0 0.25rem .7rem;font-weight:600">' + (f ? 'В семье: ' + f.members.map(function(m){ return esc(m.name || 'Участник'); }).join(' и ') : 'Ведите общий бюджет с партнёром') + '</div>' +
    '<button class="btn ghost" data-act="openfam">' + (f ? 'Управлять семьёй' : 'Создать семью или вступить') + '</button></div>';
}
function refCard(){
  if (!ONLINE || !REF) return '';
  var tiers = 'за 1 друга −10%, за 3 −20%, за 5 −50%';
  return '<div class="card set"><label style="margin-top:0">Скидка за друзей</label>' +
    '<div class="hi" style="margin:0 .25rem .5rem;font-weight:600">' + tiers + '. Скидка считается, когда друг оформил подписку.</div>' +
    '<div class="fcode">' + esc(REF.code) + '</div>' +
    '<div class="hi" style="margin:0 .25rem .6rem;font-size:.9rem;text-align:center">Пришли друзей: ' + REF.invited + ' · оплатили: ' + REF.paying + ' · ваша скидка: <b style="color:var(--ink)">' + REF.discount + '%</b></div>' +
    (BOT ? '<button class="btn ghost" data-act="invite">'+ic('plus',22)+' Позвать друзей</button>' : '') +
    (REF.referred ? '' : '<label>Вас пригласил друг? Введите его код</label><div class="row2"><input class="f" id="ref-code" placeholder="Код друга" maxlength="12" autocapitalize="characters" style="flex:1;margin:0"><button class="chip" data-act="refuse">Применить</button></div>') +
    '</div>';
}
function remindCard(){
  if (!ONLINE) return '';
  var hrs = [9, 12, 18, 20, 21];
  return '<div class="card set"><label style="margin-top:0">Напоминания в боте</label>' +
    '<div class="tog"><span>Если не записали траты за день</span><button class="'+(PREFS.remind ? 'on' : '')+'" data-act="remtog" data-k="remind">'+(PREFS.remind ? 'Вкл' : 'Выкл')+'</button></div>' +
    '<div class="tog"><span>Итоги недели по понедельникам</span><button class="'+(PREFS.weekly ? 'on' : '')+'" data-act="remtog" data-k="weekly">'+(PREFS.weekly ? 'Вкл' : 'Выкл')+'</button></div>' +
    '<label>Во сколько присылать</label><div class="chips">' + hrs.map(function(h){ return '<button class="chip '+(PREFS.hour === h ? 'on' : '')+'" data-act="remhour" data-v="'+h+'">'+h+':00</button>'; }).join('') + '</div>' +
    '<div class="hi" style="margin:.7rem .25rem 0;font-size:.8rem;font-weight:600">Чтобы сообщения приходили, нажмите «Start» в чате с ботом.</div></div>';
}
function savePrefs(){
  api('PUT', '/api/prefs', {remind: PREFS.remind, weekly: PREFS.weekly, hour: PREFS.hour, tz: -new Date().getTimezoneOffset()}).catch(function(){ toast('Не удалось сохранить'); });
}
function recurCard(){
  var list = S.recurring || [];
  return '<div class="card set"><label style="margin-top:0">Регулярные платежи</label>' +
    (list.length ? list.map(function(r){ var c = catById(r.catId); return '<div class="rec" data-act="delrec" data-id="'+r.id+'"><div>'+(c ? ci(c.emoji,'sm') + ' ' : '')+esc(r.name)+'<br><span>каждого '+r.day+'-го числа</span></div><b>'+fmt(r.amount)+'</b></div>'; }).join('') +
      '<div class="hi" style="margin:.4rem .25rem .6rem;font-size:.8rem;font-weight:600">Нажмите на платёж, чтобы удалить</div>'
      : '<div class="hi" style="margin:0 .25rem .6rem;font-weight:600">Аренда, кредит, подписки: добавятся сами каждый месяц.</div>') +
    '<button class="btn ghost" data-act="newrec">'+ic('plus',22)+' Добавить платёж</button></div>';
}
function openRecur(){
  recCat = S.cats[0] ? S.cats[0].id : '';
  sheet('<h3>Регулярный платёж</h3><label>Название</label><input id="r-name" placeholder="Например, Аренда" autocomplete="off">' +
    '<label>Сумма, ₽</label><input id="r-amt" inputmode="decimal" placeholder="0" autocomplete="off">' +
    '<label>Категория</label><div class="cgrid">' + S.cats.map(function(c){ return '<button class="cg '+(c.id === recCat ? 'on' : '')+'" data-act="reccat" data-id="'+c.id+'"><b>'+ci(c.emoji)+'</b>'+esc(c.name)+'</button>'; }).join('') + '</div>' +
    '<label>Числа месяца (1–28)</label><input id="r-day" inputmode="numeric" value="1" autocomplete="off">' +
    '<button class="btn big" data-act="saverec">Добавить</button>');
}
function applyRecurring(){
  if (!S || !S.recurring || !S.recurring.length) return;
  var n = new Date(), cur = mk(n.getFullYear(), n.getMonth()), added = false, have = {};
  S.ops.forEach(function(o){ if (o.rid) have[o.rid] = 1; });
  S.recurring.forEach(function(r){
    var y, m;
    if (r.done) { y = +r.done.slice(0,4); m = +r.done.slice(5,7); if (m > 11) { m = 0; y++; } }
    else { y = +r.from.slice(0,4); m = +r.from.slice(5,7) - 1; }
    for (var guard = 0; guard < 48; guard++) {
      var key = mk(y, m); if (key > cur) break;
      var day = Math.min(r.day, new Date(y, m + 1, 0).getDate()), date = key + '-' + pad(day), rid = r.id + '_' + key;
      if (key === cur && date > today()) break;
      if (!have[rid]) { S.ops.push({id: uid(), rid: rid, type: 'expense', amount: r.amount, catId: r.catId, note: r.name, date: date, t: Date.now(), by: 0, auto: 1}); have[rid] = 1; }
      r.done = key; added = true;
      m++; if (m > 11) { m = 0; y++; }
    }
  });
  if (added) save();
}
function exportCard(){
  return '<div class="card set"><label style="margin-top:0">Экспорт</label><button class="btn ghost" data-act="export">Выгрузить операции (CSV для Excel)</button></div>';
}
function csvText(){
  var q = function(v){ v = String(v == null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['Дата','Тип','Категория','Сумма','Комментарий','Кто']];
  S.ops.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.t - b.t; }).forEach(function(o){
    var c = catById(o.catId);
    rows.push([o.date, o.type === 'income' ? 'Доход' : 'Расход', c ? c.name : '', o.amount, o.note || '', scope === 'fam' && o.by ? memberName(o.by) : '']);
  });
  return rows.map(function(r){ return r.map(q).join(';'); }).join('\n');
}
function openOnboard(){
  var inc = S.defaultIncome || '';
  sheet('<h3>Давайте настроим Копилку</h3>' +
    '<div class="hi" style="margin:.2rem 0 .4rem;font-weight:600">Три вопроса, и приложение посчитает, сколько откладывать.</div>' +
    '<label>1. Ваш доход в месяц, ₽</label><input id="o-inc" inputmode="decimal" value="'+inc+'" placeholder="Например, 90000" autocomplete="off">' +
    '<label>2. На что копите?</label><input id="o-goal" placeholder="Например, Отпуск" autocomplete="off">' +
    '<div class="row2" style="margin-top:.5rem"><input id="o-target" inputmode="decimal" placeholder="Сумма цели, ₽" style="flex:1" autocomplete="off"><input id="o-months" inputmode="numeric" placeholder="За сколько мес." style="flex:1" autocomplete="off"></div>' +
    '<button class="btn ghost" style="margin-top:.8rem" data-act="onboardskip">Пропустить</button>' +
    '<button class="btn big" data-act="onboarddone">Готово</button>');
}
function maybeOnboard(){
  if (scope === 'me' && S && !S.onboarded && S.ops.length === 0) setTimeout(function(){ if (!$('#sheet').classList.contains('on')) openOnboard(); }, 400);
}
function copyText(t){
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function(){ toast('Скопировано'); }, function(){ fallbackCopy(t); }); return; } } catch(e){}
  fallbackCopy(t);
}
function fallbackCopy(t){
  var ta = $('#csv-text');
  if (ta) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Скопировано'); return; } catch(e){} }
  toast('Выделите текст и скопируйте вручную');
}

function loadExtras(){
  if (!ONLINE) return;
  loadFamInfo().then(function(){ if (TAB === 'set' || TAB === 'home') render(); }).catch(function(){});
  api('GET', '/api/prefs').then(function(r){ PREFS = {remind: !!r.remind, weekly: !!r.weekly, hour: r.hour || 20}; if (TAB === 'set') render(); }).catch(function(){});
  api('GET', '/api/ref').then(function(r){ REF = r; if (TAB === 'set') render(); }).catch(function(){});
}
function boot(){
  applyTheme();
  if (!ONLINE) { applyRecurring(); render(); maybeOnboard(); return; }
  $('#nav').style.display = 'none'; $('#fab').style.display = 'none';
  $('#app').innerHTML = '<div class="empty" style="padding-top:38vh;font-size:1.125rem">Загрузка…</div>';
  api('GET', '/api/state').then(function(r){
    if (typeof r.rev !== 'number') { var nb = new Error('no backend'); nb.status = 404; throw nb; }
    BOT = r.bot || '';
    if (r.state) { setState('me', normalize(r.state)); slots.me.rev = r.rev; cacheLocal('me'); }
    else {
      setState('me', normalize(S));   // новый пользователь: отправляем начальные данные на сервер
      S.goals.forEach(function(g){ if (g.img) api('PUT', '/api/img/' + g.id, {img: g.img}).catch(function(){}); });
      save();
    }
    syncState = 'ok';
  }).catch(function(e){
    if (e.status === 404 || e.status === 405) {   // сервера нет (например, GitHub Pages): храним данные на телефоне
      ONLINE = false; syncState = 'local'; setState('me', normalize(S)); return;
    }
    if (e.status === 401) {
      blocked = true;
      $('#app').innerHTML = '<div class="card empty">Не удалось войти. Закройте приложение и откройте его заново через бота в Telegram.</div>';
      return;
    }
    setState('me', normalize(S)); syncState = 'offline'; toast('Нет связи с сервером. Работаю офлайн');
  }).then(function(){
    if (blocked) return;
    applyRecurring();
    $('#nav').style.display = ''; render();
    loadExtras(); maybeOnboard();
  });
}

function pull(sc){
  var sl = slots[sc];
  if (!sl.s || sl.inflight || sl.pending || sl.dirty) return;
  (sc === 'fam' ? loadFamInfo().catch(function(){}) : Promise.resolve()).then(function(){ return api('GET', '/api/state' + qs(sc)); }).then(function(r){
    if (r.state && r.rev > sl.rev && !sl.dirty && !sl.inflight) {
      setState(sc, normalize(r.state)); sl.rev = r.rev; syncState = 'ok'; cacheLocal(sc);
      if (!$('#sheet').classList.contains('on')) render();
    }
  }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if (!ONLINE || blocked) return;
  if (document.hidden) { ['me', 'fam'].forEach(function(sc){ if (slots[sc].dirty) { clearTimeout(slots[sc].pushT); push(sc); } }); return; }
  pull('me'); if (FAM && FAM.family && slots.fam.s) pull('fam');
});
setInterval(function(){ if (ONLINE && !blocked && !document.hidden && scope === 'fam') pull('fam'); }, 20000);

boot();
})();
</script>
